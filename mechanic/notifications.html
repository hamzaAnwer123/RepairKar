<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications - RepairKar</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/x-icon" href="../assets/images/logo/favicon.ico">
<link rel="stylesheet" href="../assets/css/tailwind.min.css">
<link rel="stylesheet" href="../assets/css/loader.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  body { font-family: Inter, ui-sans-serif, sans-serif; }
  .notification-row { border: 1px solid #e2e8f0; }
  .notification-row.unread { background: #edf8f7; border-color: #b9e2dc; }
  .notification-row:hover { border-color: #99d4cc; }
  .icon-box { width: 42px; height: 42px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
<div class="md:flex md:min-h-screen">
  <aside class="hidden md:flex md:w-64 md:shrink-0 md:flex-col border-r border-slate-100 bg-white">
    <div class="flex items-center gap-3 border-b border-slate-100 px-5 py-5">
      <img id="shop-photo" src="../assets/images/placeholders/default-mechnaic-profile.png" alt="" width="40" height="40" class="h-10 w-10 rounded-full object-cover">
      <div class="min-w-0">
        <p id="shop-name" class="truncate text-sm font-bold text-slate-900">Your Shop</p>
      </div>
    </div>
    <nav class="flex-1 space-y-1 px-3 py-4" aria-label="Mechanic navigation">
      <a href="dashboard.html" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-50"><i class="fa-solid fa-table-cells-large w-4 text-center" aria-hidden="true"></i>Dashboard</a>
      <a href="my-gigs.html" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-50"><i class="fa-solid fa-wrench w-4 text-center" aria-hidden="true"></i>My Gigs</a>
      <a href="messages.html" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-50"><i class="fa-regular fa-comment w-4 text-center" aria-hidden="true"></i>Chats</a>
      <a href="notifications.html" class="flex items-center gap-3 rounded-xl bg-brand-light px-3 py-2.5 text-sm font-semibold text-brand"><i class="fa-regular fa-bell w-4 text-center" aria-hidden="true"></i>Notifications</a>
      <a href="profile.html" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-50"><i class="fa-regular fa-user w-4 text-center" aria-hidden="true"></i>Profile</a>
    </nav>
    <button id="logout-btn" type="button" class="mx-3 mb-4 flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-red-500 hover:bg-red-50"><i class="fa-solid fa-arrow-right-from-bracket w-4 text-center" aria-hidden="true"></i>Logout</button>
  </aside>

  <div class="flex-1 min-w-0">
    <header class="border-b border-slate-100 bg-white">
      <div class="flex items-center justify-between px-4 py-4 md:px-8">
        <div class="flex items-center gap-3">
          <button id="mobile-menu-btn" type="button" aria-label="Open menu" class="md:hidden h-9 w-9 rounded-full text-slate-600 hover:bg-slate-100"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
          <h1 class="text-xl font-extrabold text-slate-900">Notifications</h1>
        </div>
        <button id="mark-all-read-btn" type="button" class="text-xs font-semibold text-brand hover:underline">Mark all read</button>
      </div>
      <nav class="flex max-w-2xl border-t border-slate-100 px-4 md:mx-auto" aria-label="Notification filters">
        <button type="button" data-filter="all" class="filter-btn flex-1 border-b-2 border-brand py-3 text-xs font-semibold text-brand">All</button>
        <button type="button" data-filter="booking" class="filter-btn flex-1 border-b-2 border-transparent py-3 text-xs font-medium text-slate-500">Bookings</button>
        <button type="button" data-filter="message" class="filter-btn flex-1 border-b-2 border-transparent py-3 text-xs font-medium text-slate-500">Messages</button>
        <button type="button" data-filter="system" class="filter-btn flex-1 border-b-2 border-transparent py-3 text-xs font-medium text-slate-500">System</button>
      </nav>
    </header>

    <main class="mx-auto max-w-3xl px-4 py-5 md:px-8">
      <div id="loading" class="space-y-3" aria-label="Loading notifications">
        <div class="h-20 rounded-2xl bg-slate-200"></div><div class="h-20 rounded-2xl bg-slate-200"></div>
      </div>
      <div id="notification-list" class="hidden space-y-3"></div>
      <div id="empty-state" class="hidden py-20 text-center"><i class="fa-regular fa-bell-slash text-3xl text-slate-300" aria-hidden="true"></i><p class="mt-3 text-sm font-semibold text-slate-600">No notifications</p><p class="mt-1 text-xs text-slate-400">You are all caught up.</p></div>
      <p id="error-state" class="hidden py-20 text-center text-sm text-red-500">Could not load notifications. Please refresh the page.</p>
    </main>
  </div>
</div>

<script>
(function () {
  const loading = document.getElementById('loading');
  const list = document.getElementById('notification-list');
  const empty = document.getElementById('empty-state');
  const error = document.getElementById('error-state');
  const readKey = 'repairkar-mechanic-read-notifications';
  let activeFilter = 'all';
  let notifications = [];
  let readIds = JSON.parse(localStorage.getItem(readKey) || '[]');

  function timeLabel(dateValue) {
    if (!dateValue) return '';
    const date = new Date(dateValue);
    const minutes = Math.floor((Date.now() - date.getTime()) / 60000);
    if (minutes < 1) return 'Just now';
    if (minutes < 60) return minutes + 'm ago';
    if (minutes < 1440) return Math.floor(minutes / 60) + 'h ago';
    return date.toLocaleDateString();
  }

  function addNotification(id, type, title, message, createdAt, href, icon, color) {
    notifications.push({ id: id, type: type, title: title, message: message, createdAt: createdAt, href: href, icon: icon, color: color, isRead: readIds.indexOf(id) !== -1 });
  }

  function render() {
    const filtered = activeFilter === 'all' ? notifications : notifications.filter(function (item) { return item.type === activeFilter; });
    list.innerHTML = '';
    if (!filtered.length) { list.classList.add('hidden'); empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden'); list.classList.remove('hidden');
    filtered.forEach(function (item) {
      const row = document.createElement(item.href ? 'a' : 'div');
      if (item.href) row.href = item.href;
      row.className = 'notification-row ' + (item.isRead ? '' : 'unread') + ' flex items-start gap-3 rounded-2xl p-4';
      const iconBox = document.createElement('span'); iconBox.className = 'icon-box ' + item.color;
      const icon = document.createElement('i'); icon.className = 'fa-solid ' + item.icon; iconBox.appendChild(icon); row.appendChild(iconBox);
      const content = document.createElement('div'); content.className = 'min-w-0 flex-1';
      const title = document.createElement('p'); title.className = 'text-sm font-semibold text-slate-900'; title.textContent = item.title; content.appendChild(title);
      const message = document.createElement('p'); message.className = 'mt-1 text-xs text-slate-500'; message.textContent = item.message; content.appendChild(message); row.appendChild(content);
      const time = document.createElement('time'); time.className = 'shrink-0 text-[11px] text-slate-400'; time.textContent = timeLabel(item.createdAt); row.appendChild(time);
      row.addEventListener('click', function () { item.isRead = true; if (readIds.indexOf(item.id) === -1) readIds.push(item.id); localStorage.setItem(readKey, JSON.stringify(readIds)); row.classList.remove('unread'); });
      list.appendChild(row);
    });
  }

  document.querySelectorAll('.filter-btn').forEach(function (button) {
    button.addEventListener('click', function () {
      activeFilter = button.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(function (other) { other.classList.toggle('border-brand', other === button); other.classList.toggle('text-brand', other === button); other.classList.toggle('font-semibold', other === button); other.classList.toggle('border-transparent', other !== button); other.classList.toggle('text-slate-500', other !== button); other.classList.toggle('font-medium', other !== button); });
      render();
    });
  });

  document.getElementById('mark-all-read-btn').addEventListener('click', function () {
    notifications.forEach(function (item) { item.isRead = true; if (readIds.indexOf(item.id) === -1) readIds.push(item.id); });
    localStorage.setItem(readKey, JSON.stringify(readIds)); render();
  });

  document.getElementById('logout-btn').addEventListener('click', function () { fetch('../api/logout.php', { method: 'POST', credentials: 'same-origin' }).finally(function () { window.location.href = '../login.html'; }); });
  document.getElementById('mobile-menu-btn').addEventListener('click', function () { window.location.href = 'dashboard.html'; });

  fetch('../api/current-user.php', { credentials: 'same-origin' })
    .then(function (res) { if (!res.ok) throw new Error('guest'); return res.json(); })
    .then(function (user) {
      if (user.role === 'user') { window.location.replace('../user/dashboard.html'); return; }
      if (user.role === 'admin') { window.location.replace('../admin/index.php'); return; }
      if (user.role !== 'mechanic') { window.location.replace('../login.html'); return; }

      document.getElementById('shop-name').textContent = user.name || 'Your Shop';
      document.getElementById('shop-photo').src = user.photo || '../assets/images/placeholders/default-mechnaic-profile.png';

      return Promise.all([
        fetch('../api/get-booking-requests.php', { credentials: 'same-origin' }).then(function (response) { if (!response.ok) throw new Error('requests'); return response.json(); }),
        fetch('../api/get-conversations.php', { credentials: 'same-origin' }).then(function (response) { if (!response.ok) throw new Error('conversations'); return response.json(); })
      ]).then(function (results) {
        const requests = Array.isArray(results[0].requests) ? results[0].requests : [];
        const conversations = Array.isArray(results[1].conversations) ? results[1].conversations : [];
        requests.forEach(function (request) { addNotification('booking-' + request.id, 'booking', 'New booking request', (request.userName || 'A customer') + ' requested ' + (request.description || 'a repair service') + '.', request.createdAt, 'dashboard.html', 'fa-calendar-check', 'bg-brand-light text-brand'); });
        conversations.forEach(function (conversation) { if (conversation.unreadCount > 0) addNotification('message-' + conversation.bookingId, 'message', 'Unread customer messages', (conversation.userName || 'Customer') + ' sent ' + conversation.unreadCount + ' unread message' + (conversation.unreadCount === 1 ? '' : 's') + '.', new Date().toISOString(), 'messages.html?booking_id=' + encodeURIComponent(conversation.bookingId), 'fa-comment', 'bg-blue-50 text-blue-500'); });
        loading.classList.add('hidden'); render();
      });
    })
    .catch(function () { window.location.replace('../login.html'); });
})();
</script>
<script src="../assets/js/loader.js"></script>
</body>
</html>
