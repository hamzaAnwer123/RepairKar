<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create a Gig — RepairKar</title>
<meta name="description" content="List a new service on RepairKar and start receiving bookings from nearby users.">
<meta name="robots" content="noindex, follow">

<link rel="icon" type="image/x-icon" href="../assets/images/logo/favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Tailwind CSS — compiled via Tailwind CLI. Run `npm run build:css` after adding new classes. -->
<link rel="stylesheet" href="../assets/css/tailwind.min.css">
<link rel="stylesheet" href="../assets/css/loader.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">

<style>
  body { font-family: 'Inter', sans-serif; }

  @media (prefers-reduced-motion: no-preference) {
    .fade-in-up    { animation: fadeInUp 0.4s ease-out both; }
    .fade-in-up-d1 { animation: fadeInUp 0.4s ease-out 0.08s both; }
    .btn-tap       { transition: transform 0.12s ease-out; }
    .btn-tap:active { transform: scale(0.97); }
    .photo-in      { animation: popIn 0.25s cubic-bezier(0.34,1.56,0.64,1) both; }
    .error-msg     { animation: fadeInDown 0.25s ease-out both; }
    .shake         { animation: shake 0.3s ease-in-out; }
    .preview-flash { animation: previewFlash 0.4s ease-out; }
    .upload-tile   { transition: border-color 0.15s ease-out, background-color 0.15s ease-out; }
  }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
  @keyframes fadeInDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @keyframes previewFlash { 0% { background-color: rgb(230 244 242); } 100% { background-color: transparent; } }
</style>

<!--
  SECURITY NOTE: the preview card below reflects the mechanic's OWN
  input as they type — still rendered via textContent, never innerHTML,
  since even a mechanic's own draft text could contain characters that
  would otherwise be interpreted as markup. Server-side (create-gig.php)
  must independently re-validate every field (lengths, price bounds,
  category whitelist) and verify uploaded images by real MIME type, not
  just file extension, before accepting them.
-->

</head>
<body class="bg-slate-50 text-slate-800 antialiased">

<!-- ================= HEADER ================= -->
<header class="sticky top-0 z-40 bg-white border-b border-slate-100">
  <div class="max-w-2xl mx-auto px-4 py-3 flex items-center gap-3">
    <a href="dashboard.html" aria-label="Back" class="w-9 h-9 rounded-full hover:bg-slate-100 flex items-center justify-center shrink-0">
      <i class="fa-solid fa-arrow-left text-slate-600" aria-hidden="true"></i>
    </a>
    <h1 class="flex-1 text-base font-bold text-slate-900">Create a Gig</h1>
  </div>
</header>

<main class="max-w-2xl mx-auto px-4 py-5 pb-28 space-y-5">

  <!-- ================= LIVE PREVIEW ================= -->
  <section class="fade-in-up">
    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2 px-1">Preview</p>
    <div id="preview-card" class="rounded-2xl bg-white border border-slate-100 p-4">
      <div class="flex gap-3">
        <div id="preview-photo-wrap" class="w-16 h-16 rounded-xl bg-slate-100 shrink-0 overflow-hidden flex items-center justify-center">
          <i class="fa-regular fa-image text-slate-300" aria-hidden="true"></i>
          <img id="preview-photo" src="" alt="" class="hidden w-full h-full object-cover">
        </div>
        <div class="min-w-0 flex-1">
          <p id="preview-title" class="text-sm font-semibold text-slate-900 truncate">Your gig title</p>
          <p id="preview-desc" class="text-xs text-slate-500 mt-0.5 line-clamp-2">A short description will appear here.</p>
          <p id="preview-price" class="text-sm font-bold text-accent mt-1.5">Rs. —</p>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= FORM ================= -->
  <form id="gig-form" class="space-y-4" novalidate>

    <!-- Category -->
    <div class="fade-in-up-d1">
      <label for="category" class="block text-sm font-medium text-slate-700 mb-1.5">Service Category</label>
      <div class="relative">
        <select id="category" name="category" required
                class="w-full appearance-none rounded-xl border border-slate-200 px-4 py-2.5 text-sm bg-white focus:ring-2 focus:ring-brand focus:border-brand focus:outline-none">
          <option value="">Select a category</option>
          <option value="washing-machine">Washing Machine Repair</option>
          <option value="fridge">Fridge Repair</option>
          <option value="ac">AC Repair</option>
          <option value="car">Car Mechanic</option>
          <option value="bike">Bike Mechanic</option>
          <option value="electrician">Electrician</option>
          <option value="plumber">Plumber</option>
          <option value="generator">Generator / UPS Repair</option>
          <option value="towing">Towing &amp; Recovery</option>
          <option value="tire">Tire &amp; Puncture</option>
          <option value="battery">Battery &amp; Jumpstart</option>
        </select>
        <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-xs text-slate-400 pointer-events-none" aria-hidden="true"></i>
      </div>
      <p class="error-msg hidden text-xs text-red-600 mt-1.5" data-error-for="category"></p>
    </div>

    <!-- Title -->
    <div class="fade-in-up-d1">
      <label for="title" class="block text-sm font-medium text-slate-700 mb-1.5">Gig Title</label>
      <input type="text" id="title" name="title" required maxlength="80" placeholder="e.g. Full Engine Diagnostic"
             class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand focus:border-brand focus:outline-none">
      <p class="error-msg hidden text-xs text-red-600 mt-1.5" data-error-for="title"></p>
    </div>

    <!-- Description -->
    <div class="fade-in-up-d1">
      <label for="description" class="block text-sm font-medium text-slate-700 mb-1.5">Description</label>
      <textarea id="description" name="description" required rows="4" maxlength="400"
                placeholder="Describe what's included in this service…"
                class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm resize-none focus:ring-2 focus:ring-brand focus:border-brand focus:outline-none"></textarea>
      <div class="flex justify-between mt-1">
        <p class="error-msg hidden text-xs text-red-600" data-error-for="description"></p>
        <p id="desc-count" class="text-[11px] text-slate-400 ml-auto">0 / 400</p>
      </div>
    </div>

    <!-- Price range -->
    <div class="fade-in-up-d1">
      <label class="block text-sm font-medium text-slate-700 mb-1.5">Price Range (Rs.)</label>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="price-min" class="sr-only">Minimum price</label>
          <input type="number" id="price-min" name="price_min" required min="0" placeholder="Min"
                 class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand focus:border-brand focus:outline-none">
        </div>
        <div>
          <label for="price-max" class="sr-only">Maximum price</label>
          <input type="number" id="price-max" name="price_max" min="0" placeholder="Max (optional)"
                 class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand focus:border-brand focus:outline-none">
        </div>
      </div>
      <p class="error-msg hidden text-xs text-red-600 mt-1.5" data-error-for="price"></p>
    </div>

    <!-- Photo upload -->
    <div class="fade-in-up-d1">
      <label class="block text-sm font-medium text-slate-700 mb-1.5">Work Sample Photos</label>
      <div id="upload-grid" class="grid grid-cols-4 gap-2">
        <button type="button" id="add-photo-tile" aria-label="Add photo"
                class="upload-tile aspect-square rounded-xl border-2 border-dashed border-slate-200 hover:border-brand hover:bg-brand-light/30 flex flex-col items-center justify-center gap-1 text-slate-400">
          <i class="fa-solid fa-plus text-sm" aria-hidden="true"></i>
          <span class="text-[10px] font-medium">Add</span>
        </button>
      </div>
      <input type="file" id="photo-input" accept="image/*" multiple class="hidden">
      <p class="error-msg hidden text-xs text-red-600 mt-1.5" data-error-for="photos"></p>
      <p class="text-[11px] text-slate-400 mt-1.5">Up to 4 photos, max 5MB each.</p>
    </div>

  </form>
</main>

<!-- ================= STICKY PUBLISH BAR ================= -->
<div class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-100 z-40">
  <div class="max-w-2xl mx-auto px-4 py-3.5">
    <button type="submit" form="gig-form" id="publish-btn"
            class="btn-tap w-full inline-flex items-center justify-center gap-2 rounded-xl bg-accent hover:bg-accent-dark disabled:opacity-60 disabled:cursor-not-allowed text-white text-sm font-semibold px-5 py-3.5 transition-colors">
      <i id="publish-spinner" class="fa-solid fa-spinner animate-spin hidden" aria-hidden="true"></i>
      <span id="publish-text">Publish Gig</span>
    </button>
  </div>
</div>

<script>
(function () {

  const MAX_PHOTOS = 4;
  const MAX_PHOTO_MB = 5;

  const previewPhotoWrap = document.getElementById('preview-photo-wrap');
  const previewPhoto      = document.getElementById('preview-photo');
  const previewTitle      = document.getElementById('preview-title');
  const previewDesc       = document.getElementById('preview-desc');
  const previewPrice      = document.getElementById('preview-price');
  const previewCard       = document.getElementById('preview-card');

  const categoryInput    = document.getElementById('category');
  const titleInput       = document.getElementById('title');
  const descriptionInput = document.getElementById('description');
  const descCount        = document.getElementById('desc-count');
  const priceMinInput    = document.getElementById('price-min');
  const priceMaxInput    = document.getElementById('price-max');

  const uploadGrid    = document.getElementById('upload-grid');
  const addPhotoTile  = document.getElementById('add-photo-tile');
  const photoInput    = document.getElementById('photo-input');

  const gigForm       = document.getElementById('gig-form');
  const publishBtn    = document.getElementById('publish-btn');
  const publishSpinner = document.getElementById('publish-spinner');
  const publishText    = document.getElementById('publish-text');

  let selectedFiles = []; // { file, previewUrl }

  // ---- Live preview updates ----
  function updatePreview() {
    previewTitle.textContent = titleInput.value.trim() || 'Your gig title';
    previewDesc.textContent = descriptionInput.value.trim() || 'A short description will appear here.';

    const min = priceMinInput.value.trim();
    const max = priceMaxInput.value.trim();
    if (min) {
      previewPrice.textContent = 'Rs. ' + min + (max && max !== min ? '–' + max : '+');
    } else {
      previewPrice.textContent = 'Rs. —';
    }

    previewCard.classList.remove('preview-flash');
    void previewCard.offsetWidth;
    previewCard.classList.add('preview-flash');
  }

  titleInput.addEventListener('input', updatePreview);
  descriptionInput.addEventListener('input', function () {
    descCount.textContent = descriptionInput.value.length + ' / 400';
    updatePreview();
  });
  priceMinInput.addEventListener('input', updatePreview);
  priceMaxInput.addEventListener('input', updatePreview);

  // ---- Photo upload ----
  addPhotoTile.addEventListener('click', function () { photoInput.click(); });

  photoInput.addEventListener('change', function () {
    clearFieldError('photos');
    const incoming = Array.from(photoInput.files || []);
    photoInput.value = '';

    for (const file of incoming) {
      if (selectedFiles.length >= MAX_PHOTOS) {
        showFieldError('photos', 'You can upload up to ' + MAX_PHOTOS + ' photos.');
        break;
      }
      if (!file.type.startsWith('image/')) {
        showFieldError('photos', 'Only image files are allowed.');
        continue;
      }
      if (file.size > MAX_PHOTO_MB * 1024 * 1024) {
        showFieldError('photos', 'Each photo must be smaller than ' + MAX_PHOTO_MB + 'MB.');
        continue;
      }
      const previewUrl = URL.createObjectURL(file);
      selectedFiles.push({ file: file, previewUrl: previewUrl });
    }
    renderUploadGrid();
    updatePreviewPhoto();
  });

  function renderUploadGrid() {
    uploadGrid.querySelectorAll('[data-photo-index]').forEach(function (el) { el.remove(); });

    selectedFiles.forEach(function (item, index) {
      const tile = document.createElement('div');
      tile.className = 'photo-in relative aspect-square rounded-xl overflow-hidden bg-slate-100';
      tile.dataset.photoIndex = index;

      const img = document.createElement('img');
      img.src = item.previewUrl;
      img.alt = '';
      img.className = 'w-full h-full object-cover';
      tile.appendChild(img);

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.setAttribute('aria-label', 'Remove photo');
      removeBtn.className = 'btn-tap absolute top-1 right-1 w-5 h-5 rounded-full bg-black/60 text-white flex items-center justify-center';
      removeBtn.innerHTML = '<i class="fa-solid fa-xmark text-[10px]" aria-hidden="true"></i>';
      removeBtn.addEventListener('click', function () {
        URL.revokeObjectURL(item.previewUrl);
        selectedFiles.splice(index, 1);
        renderUploadGrid();
        updatePreviewPhoto();
      });
      tile.appendChild(removeBtn);

      uploadGrid.insertBefore(tile, addPhotoTile);
    });

    addPhotoTile.classList.toggle('hidden', selectedFiles.length >= MAX_PHOTOS);
  }

  function updatePreviewPhoto() {
    if (selectedFiles.length > 0) {
      previewPhoto.src = selectedFiles[0].previewUrl;
      previewPhoto.classList.remove('hidden');
      previewPhotoWrap.querySelector('i').classList.add('hidden');
    } else {
      previewPhoto.classList.add('hidden');
      previewPhotoWrap.querySelector('i').classList.remove('hidden');
    }
  }

  // ---- Validation helpers ----
  function showFieldError(fieldId, message) {
    const el = document.querySelector('[data-error-for="' + fieldId + '"]');
    if (!el) return;
    el.textContent = message;
    el.classList.remove('hidden');
  }
  function clearFieldError(fieldId) {
    const el = document.querySelector('[data-error-for="' + fieldId + '"]');
    if (!el) return;
    el.classList.add('hidden');
    el.textContent = '';
  }
  function clearAllErrors() {
    document.querySelectorAll('.error-msg').forEach(function (el) {
      el.classList.add('hidden');
      el.textContent = '';
    });
  }

  // ---- Submit ----
  gigForm.addEventListener('submit', function (e) {
    e.preventDefault();
    clearAllErrors();

    const category = categoryInput.value;
    const title = titleInput.value.trim();
    const description = descriptionInput.value.trim();
    const priceMin = priceMinInput.value.trim();
    const priceMax = priceMaxInput.value.trim();

    let hasError = false;

    if (!category) {
      showFieldError('category', 'Please select a category.');
      hasError = true;
    }
    if (title.length < 5) {
      showFieldError('title', 'Title must be at least 5 characters.');
      hasError = true;
    }
    if (description.length < 20) {
      showFieldError('description', 'Description must be at least 20 characters.');
      hasError = true;
    }
    if (!priceMin || Number(priceMin) <= 0) {
      showFieldError('price', 'Enter a valid minimum price.');
      hasError = true;
    } else if (priceMax && Number(priceMax) < Number(priceMin)) {
      showFieldError('price', 'Maximum price must be greater than or equal to the minimum.');
      hasError = true;
    }

    if (hasError) {
      gigForm.classList.add('shake');
      setTimeout(function () { gigForm.classList.remove('shake'); }, 300);
      return;
    }

    publishBtn.disabled = true;
    publishSpinner.classList.remove('hidden');
    publishText.textContent = 'Publishing...';

    const formData = new FormData();
    formData.append('category', category);
    formData.append('title', title);
    formData.append('description', description);
    formData.append('price_min', priceMin);
    if (priceMax) formData.append('price_max', priceMax);
    selectedFiles.forEach(function (item, i) { formData.append('photos[]', item.file); });

    fetch('../api/create-gig.php', { method: 'POST', credentials: 'same-origin', body: formData })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok) throw new Error(result.data && result.data.message ? result.data.message : 'Could not publish gig.');
        window.location.href = 'my-gigs.html';
      })
      .catch(function (err) {
        showFieldError('title', err.message);
        publishBtn.disabled = false;
        publishSpinner.classList.add('hidden');
        publishText.textContent = 'Publish Gig';
      });
  });

  updatePreview();
})();
</script>

<script src="../assets/js/loader.js"></script>
</body>
</html>
