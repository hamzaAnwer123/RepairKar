<style>
  html, body {
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    margin: 0;
    padding: 0;
    position: fixed;
    inset: 0;
    width: 100%;
  }
  body {
    font-family: 'Inter', sans-serif;
    background: #eef2f5;
    color: #0f172a;
  }

  .app-layout {
    display: flex;
    height: 100%;
    height: 100dvh;
    width: 100%;
    overflow: hidden;
  }

  #conversations-panel,
  #chat-panel {
    background: #f7f9fb;
    height: 100%;
    height: 100dvh;
    max-height: 100%;
  }

  #conversations-panel {
    border-right: 1px solid #e5e7eb;
  }

  .row-enter {
    border-radius: 18px;
    border: 1px solid transparent;
  }

  .row-enter:hover {
    background: #f1f5f9;
  }

  .row-enter.bg-brand-light {
    background: #edf8f7 !important;
    border-color: #dfeceb;
  }

  #conversations-list {
    padding: 10px 12px 16px;
  }

  #messages-scroll {
    background: #edf1f4;
  }

  #chat-panel { position: relative; }

  .scroll-latest-btn {
    position: absolute;
    right: 22px;
    bottom: 74px;
    z-index: 30;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #475569;
    background: rgba(255,255,255,0.96);
    border: 1px solid #dbe4ea;
    box-shadow: 0 4px 14px rgba(15,23,42,0.16);
  }

  #messages-list {
    padding-top: 10px;
    padding-bottom: 18px;
  }

  .message-bubble {
    max-width: 72%;
    border-radius: 22px;
    padding: 12px 14px 10px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
  }

  .message-bubble.self {
    background: linear-gradient(135deg, #0f766e, #0f9a94);
    color: #ffffff;
    border-bottom-right-radius: 8px;
  }

  .message-bubble.other {
    background: rgba(255,255,255,0.85);
    color: #1f2937;
    border: 1px solid rgba(148,163,184,0.18);
    border-bottom-left-radius: 8px;
  }

  .message-bubble .time-stamp {
    font-size: 10px;
    opacity: 0.72;
    margin-top: 8px;
    display: block;
  }

    .message-bubble.self .time-stamp { color: rgba(255,255,255,0.85); }
  .message-bubble.other .time-stamp { color: #64748b; }

  .tick {
    display: inline-flex;
    align-items: center;
    margin-left: 2px;
    font-size: 11px;
    line-height: 1;
    opacity: 0.7;
  }
  .tick.read {
    opacity: 1;
    color: #3b82f6;
  }
  .tick-group {
    display: inline-flex;
    align-items: center;
    gap: -2px;
  }

  .media-preview {
    position: relative;
    display: inline-block;
    max-width: 100%;
  }

  .media-preview img {
    display: block;
    max-width: 100%;
    max-height: 320px;
    object-fit: contain;
  }

  .media-download {
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    background: rgba(15, 23, 42, 0.78);
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.25);
  }

  #message-form {
    background: #f4f6f8;
    border-top: 1px solid #e5e7eb;
    padding: 8px 10px 10px;
  }

  #message-input {
    background: rgba(255,255,255,0.9);
    border: 1.5px solid #bfd2db;
    border-radius: 22px;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.4;
    min-height: 42px;
    width: 100%;
    box-sizing: border-box;
  }

  #message-input:focus {
    border-color: #2cb3a8;
    box-shadow: 0 0 0 3px rgba(34,197,94,0.09);
    background: #fff;
    outline: none;
  }

  #send-btn {
    background: linear-gradient(135deg, #f59e0b, #f97316);
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 50%;
    box-shadow: 0 4px 12px rgba(249,115,22,0.3);
  }

  #attach-toggle-btn {
    background: transparent;
    color: #64748b;
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
    font-size: 18px;
    transition: background 0.15s;
  }
  #attach-toggle-btn:hover { background: #e2e8f0; }
  #attach-toggle-btn.active { color: #0f766e; background: #edf8f7; }

  #attach-tray {
    display: none;
    padding: 8px 10px 4px;
    gap: 6px;
    flex-wrap: wrap;
    border-bottom: 1px solid #e5e7eb;
    background: #f4f6f8;
  }
  #attach-tray.open { display: flex; }
  .attach-tray-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    background: #fff;
    cursor: pointer;
    font-size: 18px;
    color: #475569;
    transition: background 0.15s;
    min-width: 60px;
  }
  .attach-tray-btn span { font-size: 10px; font-weight: 500; color: #64748b; }
  .attach-tray-btn:hover { background: #f1f5f9; }

  @media (min-width: 640px) {
    #attach-toggle-btn { display: none; }
    #attach-tray { display: none !important; }
    .attach-desktop-btn { display: flex; }
  }
  @media (max-width: 639px) {
    .attach-desktop-btn { display: none !important; }
    #attach-toggle-btn { display: flex; }
  }

  #attach-btn, #share-location-btn { background: transparent; color: #64748b; }
  #attach-btn:hover, #share-location-btn:hover { background: #e2e8f0; }

  .chat-row {
    display: flex;
    margin-bottom: 10px;
  }

  .chat-row.self { justify-content: flex-end; }
  .chat-row.other { justify-content: flex-start; }

</style>

<!--
  SECURITY NOTE: every message body, customer name, and booking
  reference rendered below is untrusted content — MUST use
  textContent, never innerHTML. api/get-messages.php and
  api/send-message.php must verify the logged-in mechanic is an actual

-->

<!-- ================= LIVE LOCATION DURATION PICKER (styled, no native prompt) ================= -->
<div id="live-location-modal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
  <div class="fade-in-up w-full max-w-sm rounded-2xl bg-white p-6 border border-slate-100 sm:rounded-2xl">
    <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-brand-light">
      <i class="fa-solid fa-location-crosshairs text-brand text-lg" aria-hidden="true"></i>
    </div>
    <h2 class="mt-4 text-lg font-bold text-slate-900 text-center">Share Live Location</h2>
    <p class="mt-1.5 text-sm text-slate-500 text-center">Choose how long the other person can see your location updates.</p>
    <div class="mt-5 grid gap-2.5">
      <button type="button" class="duration-option w-full rounded-xl border border-slate-200 bg-white px-4 py-3 flex items-center justify-between hover:bg-slate-50 text-left transition-colors" data-minutes="15">
        <span class="text-sm font-semibold text-slate-800">15 minutes</span>
        <span class="text-xs text-slate-400">Quick check-in</span>
      </button>
      <button type="button" class="duration-option w-full rounded-xl border border-slate-200 bg-white px-4 py-3 flex items-center justify-between hover:bg-slate-50 text-left transition-colors" data-minutes="60">
        <span class="text-sm font-semibold text-slate-800">1 hour</span>
        <span class="text-xs text-slate-400">Recommended</span>
      </button>
      <button type="button" class="duration-option w-full rounded-xl border border-brand bg-brand-light px-4 py-3 flex items-center justify-between hover:bg-brand-light text-left transition-colors" data-minutes="480">
        <span class="text-sm font-semibold text-brand">8 hours</span>
        <span class="text-xs text-brand-dark">Long job / shift</span>
      </button>
    </div>
    <button type="button" id="live-location-cancel" class="btn-tap mt-4 w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-50 transition-colors">Cancel</button>
  </div>
</div>

<script>
(function () {

  const CONVERSATIONS_POLL_MS = 5000;
  const MESSAGES_POLL_MS = 2500;
  const MAX_ATTACHMENT_MB = 5;

  const openDrawerBtn  = document.getElementById('open-drawer-btn');
  const closeDrawerBtn = document.getElementById('close-drawer-btn');
  const mobileDrawer    = document.getElementById('mobile-drawer');
  const drawerBackdrop  = document.getElementById('mobile-drawer-backdrop');

  const conversationsPanel  = document.getElementById('conversations-panel');
  const conversationsSkeleton = document.getElementById('conversations-skeleton');
  const conversationsList    = document.getElementById('conversations-list');
  const conversationsEmpty   = document.getElementById('conversations-empty');
  const conversationSearch   = document.getElementById('conversation-search');

  const chatPanel        = document.getElementById('chat-panel');
  const backToListBtn     = document.getElementById('back-to-list-btn');
  const activeUserPhoto    = document.getElementById('active-user-photo');
  const activeUserName     = document.getElementById('active-user-name');
  const activeBookingRef   = document.getElementById('active-booking-ref');
  const messagesScroll    = document.getElementById('messages-scroll');
  const messagesList      = document.getElementById('messages-list');
  const scrollLatestBtn   = document.getElementById('scroll-latest-btn');
  const messageForm       = document.getElementById('message-form');
  const messageInput      = document.getElementById('message-input');
  const sendBtn           = document.getElementById('send-btn');
  const attachInput        = document.getElementById('attach-input');
  const videoInput         = document.getElementById('video-input');
  const documentInput      = document.getElementById('document-input');
  const voiceCallBtn       = document.getElementById('voice-call-btn');
  const videoCallBtn       = document.getElementById('video-call-btn');
  const callOverlay        = document.getElementById('call-overlay');
  const callStatus         = document.getElementById('call-status');
  const endCallBtn         = document.getElementById('end-call-btn');
  const localVideo         = document.getElementById('local-video');
  const remoteVideo        = document.getElementById('remote-video');
  const attachmentError    = document.getElementById('attachment-error');
  const attachTray         = document.getElementById('attach-tray');
  const attachToggleBtn    = document.getElementById('attach-toggle-btn');

  function getAllBtns(id) {
    return [document.getElementById(id), document.getElementById(id + '-desktop')].filter(Boolean);
  }
  const attachBtns         = getAllBtns('attach-btn');
  const videoAttachBtns    = getAllBtns('video-attach-btn');
  const documentAttachBtns = getAllBtns('document-attach-btn');
  const voiceNoteBtns      = getAllBtns('voice-note-btn');
  const shareLocationBtns  = getAllBtns('share-location-btn');
  const liveLocationBtns   = getAllBtns('live-location-btn');

  const attachBtn       = attachBtns[0];
  const shareLocationBtn = shareLocationBtns[0];
  const voiceNoteBtn    = voiceNoteBtns[0];

  let allConversations = [];
  let activeBookingId = null;
  let conversationsTimer = null;
  let messagesTimer = null;
  let lastMessageId = 0;
  const renderedMessageIds = new Set();
  let isNearBottom = true;

  // ---- Mobile drawer ----
  function openDrawer() { mobileDrawer.classList.remove('hidden'); drawerBackdrop.classList.remove('hidden'); }
  function closeDrawer() { mobileDrawer.classList.add('hidden'); drawerBackdrop.classList.add('hidden'); }
  openDrawerBtn.addEventListener('click', openDrawer);
  closeDrawerBtn.addEventListener('click', closeDrawer);
  drawerBackdrop.addEventListener('click', closeDrawer);

  // ---- Mobile attach tray toggle ----
  function closeTray() {
    if (attachTray) attachTray.classList.remove('open');
    if (attachToggleBtn) {
      attachToggleBtn.classList.remove('active');
      attachToggleBtn.setAttribute('aria-expanded', 'false');
      const icon = attachToggleBtn.querySelector('i');
      if (icon) icon.className = 'fa-solid fa-plus';
    }
  }
  if (attachToggleBtn && attachTray) {
    attachToggleBtn.addEventListener('click', function () {
      const isOpen = attachTray.classList.toggle('open');
      attachToggleBtn.classList.toggle('active', isOpen);
      attachToggleBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      const icon = attachToggleBtn.querySelector('i');
      if (icon) icon.className = isOpen ? 'fa-solid fa-xmark' : 'fa-solid fa-plus';
    });
  }

  // ---- Auth guard, role check & Load mechanic identity for sidebar ----
  // Guests are redirected to the login page (with a return URL so they come
  // back here after logging in). Users/admins are routed to their own area.
  var isAuthenticated = false;
  var mechanicChatLoginUrl = '../login.html?redirect=' + encodeURIComponent('mechanic/messages.html' + window.location.search);

  fetch('../api/current-user.php', { credentials: 'same-origin' })
    .then(function (res) { if (!res.ok) throw new Error('guest'); return res.json(); })
    .then(function (user) {
      if (user.role === 'user') { window.location.replace('../user/dashboard.html'); return; }
      if (user.role === 'admin') { window.location.replace('../admin/index.php'); return; }
      if (user.role !== 'mechanic') { window.location.replace(mechanicChatLoginUrl); return; }

      isAuthenticated = true;
      document.getElementById('shop-name-sidebar').textContent = user.name || 'Your Shop';
      document.getElementById('shop-photo-sidebar').src = user.photo || '../assets/images/placeholders/default-mechnaic-profile.png';
      startConversationsPolling();
    })
    .catch(function () { window.location.replace(mechanicChatLoginUrl); });

  // ---- Render one conversation row (untrusted data -> textContent) ----
  function renderConversationRow(conv, index) {
    const row = document.createElement('button');
    row.type = 'button';
    row.dataset.bookingId = conv.bookingId;
    row.className = 'row-enter w-full text-left flex items-center gap-3 rounded-2xl px-3 py-2.5 ' +
      (String(conv.bookingId) === String(activeBookingId) ? 'bg-brand-light' : '');

    const avatarWrap = document.createElement('span');
    avatarWrap.className = 'relative shrink-0';
    const avatar = document.createElement('img');
    avatar.src = conv.userPhoto || '../assets/images/placeholders/default-user-profile.png';
    avatar.alt = '';
    avatar.width = 44; avatar.height = 44;
    avatar.className = 'w-11 h-11 rounded-full object-cover bg-slate-100';
    avatarWrap.appendChild(avatar);
    if (conv.userOnline) {
      const dot = document.createElement('span');
      dot.className = 'absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-green-500 border-2 border-white';
      avatarWrap.appendChild(dot);
    }
    row.appendChild(avatarWrap);

    const info = document.createElement('div');
    info.className = 'min-w-0 flex-1';
    const topRow = document.createElement('div');
    topRow.className = 'flex items-center justify-between gap-2';
    const name = document.createElement('p');
    name.className = 'text-sm font-semibold text-slate-900 truncate';
    name.textContent = conv.userName;   // untrusted — textContent only
    topRow.appendChild(name);
    const time = document.createElement('span');
    time.className = 'text-[11px] text-slate-400 shrink-0';
    time.textContent = conv.lastMessageTime || '';
    topRow.appendChild(time);
    info.appendChild(topRow);

    const bottomRow = document.createElement('div');
    bottomRow.className = 'flex items-center justify-between gap-2';
    const preview = document.createElement('p');
    preview.className = 'text-xs text-slate-500 truncate ' + (conv.unreadCount > 0 ? 'font-semibold text-slate-700' : '');
    const previewIcon = document.createElement('i');
    previewIcon.className = conversationTypeIcon(conv.lastMessageType);
    previewIcon.setAttribute('aria-hidden', 'true');
    preview.appendChild(previewIcon);
    preview.appendChild(document.createTextNode(' ' + (conv.lastMessagePreview || '')));
    bottomRow.appendChild(preview);
    if (conv.unreadCount > 0) {
      const badge = document.createElement('span');
      badge.className = 'unread-badge shrink-0 text-[10px] font-bold bg-accent text-white rounded-full min-w-[18px] h-[18px] flex items-center justify-center px-1';
      badge.textContent = conv.unreadCount;
      bottomRow.appendChild(badge);
    }
    info.appendChild(bottomRow);
    row.appendChild(info);

    row.addEventListener('click', function () { openConversation(conv); });
    return row;
  }

  function conversationTypeIcon(type) {
    const icons = { image: 'fa-solid fa-image', video: 'fa-solid fa-video', document: 'fa-solid fa-download', audio: 'fa-solid fa-microphone', location: 'fa-solid fa-location-dot', live_location: 'fa-solid fa-location-crosshairs' };
    return icons[type] || 'fa-regular fa-comment';
  }

  function renderConversationsList(filterText) {
    conversationsList.innerHTML = '';
    const filtered = filterText
      ? allConversations.filter(function (c) { return c.userName.toLowerCase().indexOf(filterText.toLowerCase()) !== -1; })
      : allConversations;

    if (!filtered.length) {
      conversationsList.classList.add('hidden');
      conversationsEmpty.classList.remove('hidden');
      return;
    }
    conversationsEmpty.classList.add('hidden');
    filtered.forEach(function (conv, i) { conversationsList.appendChild(renderConversationRow(conv, i)); });
    conversationsList.classList.remove('hidden');
  }

  conversationSearch.addEventListener('input', function () {
    renderConversationsList(conversationSearch.value.trim());
  });

  function markConversationRead() {
    if (activeBookingId == null) return;
    fetch('../api/mark-messages-read.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ booking_id: activeBookingId })
    }).then(function () { fetchConversations(); }).catch(function () {});
  }

  function updateReadTicks() {
    document.querySelectorAll('.tick-group[data-message-id]').forEach(function (group) {
      const ticks = group.querySelectorAll('.tick');
      if (ticks.length === 2 && !ticks[1].classList.contains('read')) {
        ticks[1].classList.add('read');
      }
    });
  }

  function fetchConversations() {
    fetch('../api/get-conversations.php', { credentials: 'same-origin' })
      .then(function (res) { if (!res.ok) throw new Error('failed'); return res.json(); })
      .then(function (data) {
        allConversations = Array.isArray(data.conversations) ? data.conversations : [];
        conversationsSkeleton.classList.add('hidden');
        renderConversationsList(conversationSearch.value.trim());
      })
      .catch(function () {
        conversationsSkeleton.classList.add('hidden');
        renderConversationsList('');
      });
  }

  function startConversationsPolling() {
    if (conversationsTimer) return;
    fetchConversations();
    conversationsTimer = setInterval(fetchConversations, CONVERSATIONS_POLL_MS);
  }

  // ---- Open a conversation ----
  function openConversation(conv) {
    activeBookingId = conv.bookingId;
    lastMessageId = 0;
    renderedMessageIds.clear();
    messagesList.innerHTML = '';
    stopMessagesPolling();

    activeUserName.textContent = conv.userName;   // untrusted — textContent only
    activeBookingRef.textContent = 'Booking #' + conv.bookingId;
    if (conv.userPhoto) activeUserPhoto.src = conv.userPhoto;

    conversationsPanel.classList.add('hidden');
    conversationsPanel.classList.remove('md:hidden');
    conversationsPanel.classList.add('md:flex');
    chatPanel.classList.remove('hidden');
    chatPanel.classList.add('flex');

    renderConversationsList(conversationSearch.value.trim()); // refresh highlight state
    startMessagesPolling();
    markConversationRead();
    startSignalPolling();
  }

  backToListBtn.addEventListener('click', function () {
    chatPanel.classList.add('hidden');
    chatPanel.classList.remove('flex');
    conversationsPanel.classList.remove('hidden');
    stopMessagesPolling();
  });

  // ---- Messages (mirrored bubble alignment: mechanic's own messages on the right) ----
  function scrollToBottom(smooth) {
    if (typeof messagesScroll.scrollTo === 'function') {
      try {
        messagesScroll.scrollTo({ top: messagesScroll.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
        return;
      } catch (e) { /* fall through to plain assignment below */ }
    }
    messagesScroll.scrollTop = messagesScroll.scrollHeight;
  }

  messagesScroll.addEventListener('scroll', function () {
    const threshold = 80;
    isNearBottom = messagesScroll.scrollHeight - messagesScroll.scrollTop - messagesScroll.clientHeight < threshold;
    scrollLatestBtn.classList.toggle('hidden', isNearBottom);
  });

  scrollLatestBtn.addEventListener('click', function () {
    scrollToBottom(true);
    scrollLatestBtn.classList.add('hidden');
  });

  function renderMessage(msg) {
    const isSelf = msg.senderRole === 'mechanic'; // mirrored: THIS page's own messages are 'mechanic'
    const wrap = document.createElement('div');
    wrap.className = 'chat-row ' + (isSelf ? 'self' : 'other');

    const bubble = document.createElement('div');
    bubble.className = 'message-bubble ' + (isSelf ? 'self' : 'other');

    if (msg.type === 'image') {
      const media = document.createElement('span');
      media.className = 'media-preview';
      const img = document.createElement('img');
      img.src = assetUrl(msg.content);
      img.alt = 'Shared photo';
      img.className = 'rounded-xl mb-1.5';
      img.loading = 'lazy';
      media.appendChild(img);
      media.appendChild(createMediaDownloadButton(msg.content, msg.originalFilename || 'photo'));
      bubble.appendChild(media);
    } else if (msg.type === 'video') {
      const video = document.createElement('video');
      video.src = assetUrl(msg.content);
      video.controls = true;
      video.className = 'rounded-xl max-w-full mb-1.5';
      bubble.appendChild(video);
      bubble.appendChild(createDownloadLink(msg.content, msg.originalFilename || 'video'));
    } else if (msg.type === 'audio') {
      const audio = document.createElement('audio');
      audio.src = assetUrl(msg.content);
      audio.controls = true;
      audio.className = 'max-w-full';
      bubble.appendChild(audio);
      bubble.appendChild(createDownloadLink(msg.content, msg.originalFilename || 'voice-note'));
    } else if (msg.type === 'document') {
      const link = document.createElement('a');
      link.href = assetUrl(msg.content);
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.className = 'flex items-center gap-2 text-inherit no-underline font-medium';
      const fileIcon = document.createElement('i');
      fileIcon.className = 'fa-solid fa-file-lines';
      fileIcon.setAttribute('aria-hidden', 'true');
      const fileLabel = document.createElement('span');
      fileLabel.textContent = (msg.originalFilename || 'Open document') + (msg.fileSize ? ' (' + (msg.fileSize / 1048576).toFixed(1) + ' MB)' : '');
      link.appendChild(fileIcon);
      link.appendChild(fileLabel);
      bubble.appendChild(link);
      link.download = msg.originalFilename || '';
    } else if (msg.type === 'location') {
      const map = document.createElement('iframe');
      map.src = 'https://www.google.com/maps?q=' + encodeURIComponent(msg.lat + ',' + msg.lng) + '&z=15&output=embed';
      map.title = 'Shared location on Google Maps';
      map.loading = 'lazy';
      map.referrerPolicy = 'no-referrer-when-downgrade';
      map.className = 'w-full h-36 rounded-xl mb-2 border-0';
      const locWrap = document.createElement('a');
      locWrap.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(msg.lat + ',' + msg.lng);
      locWrap.target = '_blank';
      locWrap.rel = 'noopener noreferrer';
      locWrap.className = 'flex items-center gap-2 text-inherit no-underline';
      const icon = document.createElement('i');
      icon.className = 'fa-solid fa-location-dot ' + (isSelf ? 'text-white' : 'text-brand');
      icon.setAttribute('aria-hidden', 'true');
      const text = document.createElement('span');
      text.className = 'text-sm font-medium';
      text.textContent = msg.address || 'Shared location';   // untrusted — textContent only
      locWrap.appendChild(icon);
      locWrap.appendChild(text);
      bubble.appendChild(map);
      bubble.appendChild(locWrap);
    } else if (msg.type === 'live_location') {
      const map = document.createElement('iframe');
      map.src = 'https://www.google.com/maps?q=' + encodeURIComponent(msg.lat + ',' + msg.lng) + '&z=15&output=embed';
      map.title = 'Live location on Google Maps';
      map.loading = 'lazy';
      map.referrerPolicy = 'no-referrer-when-downgrade';
      map.className = 'w-full h-36 rounded-xl mb-2 border-0';
      const locWrap = document.createElement('a'); locWrap.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(msg.lat + ',' + msg.lng); locWrap.target = '_blank'; locWrap.rel = 'noopener noreferrer'; locWrap.className = 'flex items-center gap-2 text-inherit no-underline';
      const icon = document.createElement('i'); icon.className = 'fa-solid fa-location-crosshairs'; icon.setAttribute('aria-hidden', 'true'); const text = document.createElement('span'); text.className = 'text-sm font-medium'; text.textContent = 'Live location'; locWrap.appendChild(icon); locWrap.appendChild(text); bubble.appendChild(map); bubble.appendChild(locWrap);
    } else {
      const text = document.createElement('p');
      text.className = 'text-sm whitespace-pre-wrap break-words';
      text.textContent = msg.content;   // untrusted — textContent only
      bubble.appendChild(text);
    }

    const time = document.createElement('span');
    time.className = 'time-stamp';
    time.textContent = formatTime(msg.createdAt);
    bubble.appendChild(time);

    // ---- Double tick marks (WhatsApp-style) for own messages ----
    if (isSelf) {
      const tickGroup = document.createElement('span');
      tickGroup.className = 'tick-group';
      tickGroup.setAttribute('data-message-id', msg.id);
      const tick1 = document.createElement('span');
      tick1.className = 'tick';
      tick1.textContent = '✓';
      const tick2 = document.createElement('span');
      tick2.className = 'tick' + (msg.readAt ? ' read' : '');
      tick2.textContent = '✓';
      tickGroup.appendChild(tick1);
      tickGroup.appendChild(tick2);
      bubble.appendChild(tickGroup);
    }

    wrap.appendChild(bubble);
    return wrap;
  }

  function assetUrl(path) {
    if (!path) return '';
    if (/^https?:\/\//i.test(path)) return path;
    if (path.indexOf('/assets/') === 0) return '..' + path;
    return path;
  }

  function createDownloadLink(path, filename) {
    const link = document.createElement('a');
    link.href = assetUrl(path);
    link.download = filename;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.className = 'mt-2 inline-flex items-center gap-1 text-xs font-semibold underline';
    const icon = document.createElement('i');
    icon.className = 'fa-solid fa-download';
    icon.setAttribute('aria-hidden', 'true');
    const label = document.createElement('span');
    label.textContent = 'Download';
    link.appendChild(icon);
    link.appendChild(label);
    return link;
  }

  function createMediaDownloadButton(path, filename) {
    const link = document.createElement('a');
    link.href = assetUrl(path);
    link.download = filename;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.className = 'media-download';
    link.setAttribute('aria-label', 'Download attachment');
    const icon = document.createElement('i');
    icon.className = 'fa-solid fa-download';
    icon.setAttribute('aria-hidden', 'true');
    link.appendChild(icon);
    return link;
  }

  function formatTime(iso) {
    try { return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
    catch (e) { return ''; }
  }

  function appendMessages(list) {
    const frag = document.createDocumentFragment();
    let hasNewFromOther = false;
    list.forEach(function (msg) {
      if (renderedMessageIds.has(String(msg.id))) return;
      renderedMessageIds.add(String(msg.id));
      frag.appendChild(renderMessage(msg));
      if (msg.id > lastMessageId) lastMessageId = msg.id;
      // New message from the other party means they've seen our previous messages
      if (msg.senderRole !== 'mechanic') hasNewFromOther = true;
    });
    messagesList.appendChild(frag);
    if (hasNewFromOther) updateReadTicks();
    scrollLatestBtn.classList.toggle('hidden', isNearBottom);
  }

  function pollMessages() {
    if (activeBookingId == null) return;
    const url = '../api/get-messages.php?booking_id=' + encodeURIComponent(activeBookingId) +
                (lastMessageId ? '&after=' + lastMessageId : '');
    fetch(url, { credentials: 'same-origin' })
      .then(function (res) { if (!res.ok) throw new Error('failed'); return res.json(); })
      .then(function (data) {
        if (data.customer) {
          activeUserName.textContent = data.customer.name;
          if (data.customer.photo) activeUserPhoto.src = data.customer.photo;
        }
        if (Array.isArray(data.messages) && data.messages.length) {
          appendMessages(data.messages);
          markConversationRead();
          if (isNearBottom) scrollToBottom(lastMessageId !== 0);
        }
      })
      .catch(function () { /* keep existing messages visible; retry on next poll */ });
  }
  function startMessagesPolling() {
    if (messagesTimer) return;
    pollMessages();
    messagesTimer = setInterval(pollMessages, MESSAGES_POLL_MS);
  }
  function stopMessagesPolling() {
    if (messagesTimer) { clearInterval(messagesTimer); messagesTimer = null; }
  }

  // ---- Send text ----
  messageInput.addEventListener('input', function () {
    messageInput.style.height = 'auto';
    messageInput.style.height = Math.min(messageInput.scrollHeight, 112) + 'px';
  });

  // Enter sends the message; Shift+Enter inserts a newline.

  messageInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (messageForm.requestSubmit) {
        messageForm.requestSubmit();
      } else {
        messageForm.dispatchEvent(new Event('submit', { cancelable: true }));
      }
    }
  });

  messageForm.addEventListener('submit', function (e) {
    e.preventDefault();
    if (activeBookingId == null) return;
    const content = messageInput.value.trim();
    if (!content) return;

        messageInput.value = '';
    messageInput.style.height = 'auto';
    sendBtn.disabled = true;

    fetch('../api/send-message.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ booking_id: activeBookingId, type: 'text', content: content })
    })
            .then(function (res) { if (!res.ok) throw new Error('failed'); return res.json(); })
      .then(function () { sendBtn.disabled = false; pollMessages(); })
      .catch(function () {
        sendBtn.disabled = false;
        attachmentError.textContent = 'Could not send message. Please try again.';
        attachmentError.classList.remove('hidden');
      });
  });

  // ---- Attach photo ----
  attachBtns.forEach(function(btn) {
    btn.addEventListener('click', function () { attachInput.click(); closeTray(); });
  });
  attachInput.addEventListener('change', function () {
    attachmentError.classList.add('hidden');
    const file = attachInput.files && attachInput.files[0];
    if (!file || activeBookingId == null) return;

    if (!file.type.startsWith('image/')) {
      attachmentError.textContent = 'Please select an image file.';
      attachmentError.classList.remove('hidden');
      attachInput.value = '';
      return;
    }
    if (file.size > MAX_ATTACHMENT_MB * 1024 * 1024) {
      attachmentError.textContent = 'Image must be smaller than ' + MAX_ATTACHMENT_MB + 'MB.';
      attachmentError.classList.remove('hidden');
      attachInput.value = '';
      return;
    }

    const formData = new FormData();
    formData.append('booking_id', activeBookingId);
    formData.append('type', 'image');
    formData.append('image', file);

    fetch('../api/send-message.php', { method: 'POST', credentials: 'same-origin', body: formData })
      .then(function (res) { if (!res.ok) throw new Error('failed'); return res.json(); })
      .then(function () { pollMessages(); })
      .catch(function () {
        attachmentError.textContent = 'Could not send photo. Please try again.';
        attachmentError.classList.remove('hidden');
      })
      .finally(function () { attachInput.value = ''; });
  });

  // ---- Share location ----
  shareLocationBtns.forEach(function(btn) {
    btn.addEventListener('click', function () {
      if (!navigator.geolocation || activeBookingId == null) {
        attachmentError.textContent = 'Location services are not available.';
        attachmentError.classList.remove('hidden');
        return;
      }
      closeTray();
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          fetch('../api/send-message.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ type: 'location', booking_id: activeBookingId, lat: pos.coords.latitude, lng: pos.coords.longitude, address: 'Live mechanic location' })
          })
            .then(function (res) { if (!res.ok) throw new Error('failed'); return res.json(); })
            .then(function () { pollMessages(); })
            .catch(function () {
              attachmentError.textContent = 'Could not share location.';
              attachmentError.classList.remove('hidden');
            });
        },
        function () {
          attachmentError.textContent = 'Could not access location.';
          attachmentError.classList.remove('hidden');
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
      );
    });
  });

  let liveLocationMessageId = null;
  const liveLocationModal = document.getElementById('live-location-modal');
  const liveLocationCancel = document.getElementById('live-location-cancel');

  function startLiveLocation(minutes) {
    navigator.geolocation.getCurrentPosition(function (position) {
      fetch('../api/send-message.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ booking_id: activeBookingId, type: 'live_location', lat: position.coords.latitude, lng: position.coords.longitude, address: 'Live location', duration_minutes: minutes }) }).then(function (res) { if (!res.ok) throw new Error('failed'); return res.json(); }).then(function (result) { liveLocationMessageId = result.message_id; navigator.geolocation.watchPosition(function (next) { fetch('../api/update-live-location.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ message_id: liveLocationMessageId, lat: next.coords.latitude, lng: next.coords.longitude, address: 'Live location' }) }).catch(function () {}); }); pollMessages(); }).catch(function () { attachmentError.textContent = 'Could not share live location.'; attachmentError.classList.remove('hidden'); });
    }, function () { attachmentError.textContent = 'Could not access your current location. Enable GPS/location permission and try again.'; attachmentError.classList.remove('hidden'); }, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
  }

  liveLocationBtns.forEach(function(btn) {
    btn.addEventListener('click', function () {
      if (!navigator.geolocation || activeBookingId == null) { attachmentError.textContent = 'Location services are not available.'; attachmentError.classList.remove('hidden'); return; }
      closeTray();
      if (liveLocationModal) liveLocationModal.classList.remove('hidden');
    });
  });

  if (liveLocationModal) {
    liveLocationModal.querySelectorAll('.duration-option').forEach(function (btn) {
      btn.addEventListener('click', function () {
        liveLocationModal.classList.add('hidden');
        startLiveLocation(parseInt(btn.dataset.minutes, 10));
      });
    });
    if (liveLocationCancel) liveLocationCancel.addEventListener('click', function () { liveLocationModal.classList.add('hidden'); });
    liveLocationModal.addEventListener('click', function (e) { if (e.target === liveLocationModal) liveLocationModal.classList.add('hidden'); });
  }

  function uploadFile(input, type) {
    const file = input.files && input.files[0];
    if (!file || activeBookingId == null) return;
    const maxBytes = type === 'document' ? 10 * 1024 * 1024 : 25 * 1024 * 1024;
    if (file.size > maxBytes) { attachmentError.textContent = 'File is too large.'; attachmentError.classList.remove('hidden'); input.value = ''; return; }
    const formData = new FormData();
    formData.append('booking_id', activeBookingId); formData.append('type', type); formData.append('image', file);
    fetch('../api/send-message.php', { method: 'POST', credentials: 'same-origin', body: formData }).then(function (res) { if (!res.ok) throw new Error('failed'); return res.json(); }).then(function () { pollMessages(); }).catch(function () { attachmentError.textContent = 'Could not send file. Please try again.'; attachmentError.classList.remove('hidden'); }).finally(function () { input.value = ''; });
  }
  videoAttachBtns.forEach(function(btn) {
    btn.addEventListener('click', function () { videoInput.click(); closeTray(); });
  });
  documentAttachBtns.forEach(function(btn) {
    btn.addEventListener('click', function () { documentInput.click(); closeTray(); });
  });
  videoInput.addEventListener('change', function () { uploadFile(videoInput, 'video'); });
  documentInput.addEventListener('change', function () { uploadFile(documentInput, 'document'); });

  let voiceRecorder = null;
  let voiceChunks = [];
  voiceNoteBtns.forEach(function(btn) {
    btn.addEventListener('click', function () {
      if (voiceRecorder && voiceRecorder.state === 'recording') { voiceRecorder.stop(); return; }
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        voiceChunks = [];
        voiceRecorder = new MediaRecorder(stream);
        voiceRecorder.ondataavailable = function (event) { if (event.data.size) voiceChunks.push(event.data); };
        voiceRecorder.onstop = function () {
          stream.getTracks().forEach(function (track) { track.stop(); });
          voiceNoteBtns.forEach(function(b) { b.classList.remove('text-red-500'); });
          const input = new DataTransfer();
          const file = new File([new Blob(voiceChunks, { type: voiceRecorder.mimeType || 'audio/webm' })], 'voice-note.webm', { type: voiceRecorder.mimeType || 'audio/webm' });
          input.items.add(file);
          const formData = new FormData();
          formData.append('booking_id', activeBookingId);
          formData.append('type', 'audio');
          formData.append('image', file);
          fetch('../api/send-message.php', { method: 'POST', credentials: 'same-origin', body: formData }).then(function (res) { if (!res.ok) throw new Error('failed'); return res.json(); }).then(function () { pollMessages(); }).catch(function () { attachmentError.textContent = 'Could not send voice note.'; attachmentError.classList.remove('hidden'); });
        };
        voiceRecorder.start();
        voiceNoteBtns.forEach(function(b) { b.classList.add('text-red-500'); });
        closeTray();
      }).catch(function () { attachmentError.textContent = 'Microphone permission is required.'; attachmentError.classList.remove('hidden'); });
    });
  });
  let callPeer = null;
  let callStream = null;
  let signalCursor = 0;
  let signalTimer = null;
  function sendCallSignal(type, payload) { if (activeBookingId == null) return Promise.resolve(); return fetch('../api/call-signal.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ booking_id: activeBookingId, signal_type: type, payload: payload }) }); }
  function createCallPeer(mode) { callPeer = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }); callPeer.onicecandidate = function (event) { if (event.candidate) sendCallSignal('ice', event.candidate.toJSON()); }; callPeer.ontrack = function (event) { remoteVideo.srcObject = event.streams[0]; }; callStream.getTracks().forEach(function (track) { callPeer.addTrack(track, callStream); }); if (mode === 'video') localVideo.srcObject = callStream; else { localVideo.srcObject = null; localVideo.classList.add('hidden'); } }
  async function startCall(mode) { if (activeBookingId == null || callPeer) return; if (!window.RTCPeerConnection || !navigator.mediaDevices) { attachmentError.textContent = 'Calling is not supported by this browser.'; attachmentError.classList.remove('hidden'); return; } try { callStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: mode === 'video' }); callOverlay.classList.remove('hidden'); callOverlay.classList.add('flex'); callStatus.textContent = mode === 'video' ? 'Starting video call…' : 'Starting voice call…'; createCallPeer(mode); const offer = await callPeer.createOffer(); await callPeer.setLocalDescription(offer); await sendCallSignal('offer', { description: offer, mode: mode }); startSignalPolling(); } catch (error) { endCall(); attachmentError.textContent = 'Camera or microphone permission is required.'; attachmentError.classList.remove('hidden'); } }
  async function handleCallSignal(signal) { try { if (signal.type === 'hangup') { endCall(false); return; } if (signal.type === 'offer') { if (callPeer) return; const mode = signal.payload.mode || 'voice'; callStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: mode === 'video' }); callOverlay.classList.remove('hidden'); callOverlay.classList.add('flex'); callStatus.textContent = mode === 'video' ? 'Incoming video call' : 'Incoming voice call'; createCallPeer(mode); await callPeer.setRemoteDescription(signal.payload.description); const answer = await callPeer.createAnswer(); await callPeer.setLocalDescription(answer); await sendCallSignal('answer', { description: answer }); } else if (signal.type === 'answer' && callPeer) await callPeer.setRemoteDescription(signal.payload.description); else if (signal.type === 'ice' && callPeer) await callPeer.addIceCandidate(signal.payload); } catch (error) { endCall(false); attachmentError.textContent = 'Could not establish the call. Check your camera/microphone permissions.'; attachmentError.classList.remove('hidden'); } }
  function startSignalPolling() { if (signalTimer) return; signalTimer = setInterval(function () { if (activeBookingId == null) return; fetch('../api/call-signal.php?booking_id=' + encodeURIComponent(activeBookingId) + '&after=' + signalCursor, { credentials: 'same-origin' }).then(function (res) { return res.json(); }).then(function (data) { (data.signals || []).forEach(function (signal) { signalCursor = Math.max(signalCursor, signal.id); handleCallSignal(signal).catch(function () {}); }); }).catch(function () {}); }, 1500); }
  function endCall(notify) { if (notify !== false && activeBookingId != null) sendCallSignal('hangup', {}); if (callPeer) callPeer.close(); callPeer = null; if (callStream) callStream.getTracks().forEach(function (track) { track.stop(); }); callStream = null; localVideo.srcObject = null; remoteVideo.srcObject = null; localVideo.classList.remove('hidden'); callOverlay.classList.add('hidden'); callOverlay.classList.remove('flex'); }
  voiceCallBtn.addEventListener('click', function () { startCall('voice'); }); videoCallBtn.addEventListener('click', function () { startCall('video'); }); endCallBtn.addEventListener('click', function () { endCall(true); });

  // ---- Logout ----
  function doLogout() {
    fetch('../api/logout.php', { method: 'POST', credentials: 'same-origin' })
      .then(function () { window.location.href = '../index.html'; })
      .catch(function () { window.location.href = '../login.html'; });
  }
  document.getElementById('sidebar-logout-btn').addEventListener('click', doLogout);
  document.getElementById('drawer-logout-btn').addEventListener('click', doLogout);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (conversationsTimer) { clearInterval(conversationsTimer); conversationsTimer = null; }
      stopMessagesPolling();
    } else {
      if (isAuthenticated) startConversationsPolling();
      if (activeBookingId != null) startMessagesPolling();
    }
  });

  if (isAuthenticated) startConversationsPolling();
})();
</script>

<script src="../assets/js/loader.js"></script>
