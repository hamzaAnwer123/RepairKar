<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saved Addresses - RepairKar</title><meta name="description" content="Manage your saved service addresses on RepairKar.">
<link rel="icon" type="image/x-icon" href="../assets/images/logo/favicon.ico"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/tailwind.min.css">
<link rel="stylesheet" href="../assets/css/loader.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
<header class="sticky top-0 z-40 border-b border-slate-100 bg-white"><div class="mx-auto flex max-w-3xl items-center gap-3 px-4 py-4"><a href="profile.html" aria-label="Back to profile" class="flex h-9 w-9 items-center justify-center rounded-full hover:bg-slate-100"><i class="fa-solid fa-arrow-left text-slate-600" aria-hidden="true"></i></a><h1 class="text-lg font-bold text-slate-900">Saved Addresses</h1></div></header>
<main class="mx-auto max-w-3xl space-y-5 px-4 py-6"><section class="rounded-2xl border border-slate-100 bg-white p-5"><div class="flex items-center justify-between gap-4"><div><p class="text-xs font-semibold uppercase tracking-wide text-brand">Service locations</p><h2 class="mt-1 text-xl font-extrabold text-slate-900">Your addresses</h2></div><button type="button" id="add-address" class="inline-flex items-center gap-2 rounded-xl bg-brand px-3.5 py-2.5 text-sm font-semibold text-white"><i class="fa-solid fa-plus" aria-hidden="true"></i>Add</button></div><p class="mt-2 text-sm text-slate-500">Save common locations to make booking a mechanic quicker.</p></section><section class="rounded-2xl border border-slate-100 bg-white p-4"><div id="address-list" class="space-y-3"></div><p id="empty-state" class="p-8 text-center text-sm text-slate-500">No saved addresses yet.</p></section></main>
<script>
(function () {
  const list = document.getElementById('address-list'); const empty = document.getElementById('empty-state');
  function render() { const addresses = JSON.parse(localStorage.getItem('repairkar-addresses') || '[]'); empty.classList.toggle('hidden', addresses.length > 0); list.innerHTML = addresses.map(function (address, index) { return '<div class="flex items-start gap-3 rounded-xl border border-slate-100 p-4"><span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-brand-light text-brand"><i class="fa-solid fa-location-dot" aria-hidden="true"></i></span><div class="min-w-0 flex-1"><p class="text-sm font-semibold text-slate-900">' + address.label + '</p><p class="mt-1 text-sm text-slate-500">' + address.value + '</p></div><button type="button" data-index="' + index + '" aria-label="Delete address" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-trash" aria-hidden="true"></i></button></div>'; }).join(''); }
  document.getElementById('add-address').addEventListener('click', function () { const value = window.prompt('Enter an address'); if (!value) return; const addresses = JSON.parse(localStorage.getItem('repairkar-addresses') || '[]'); addresses.push({ label: 'Saved address', value: value }); localStorage.setItem('repairkar-addresses', JSON.stringify(addresses)); render(); });
  list.addEventListener('click', function (event) { const button = event.target.closest('button[data-index]'); if (!button) return; const addresses = JSON.parse(localStorage.getItem('repairkar-addresses') || '[]'); addresses.splice(Number(button.dataset.index), 1); localStorage.setItem('repairkar-addresses', JSON.stringify(addresses)); render(); }); render();
}());
</script>
<script src="../assets/js/loader.js"></script>
</body>
</html>
