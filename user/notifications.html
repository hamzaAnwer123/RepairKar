<style>
  body { font-family: 'Inter', sans-serif; }

  @media (prefers-reduced-motion: no-preference) {
    .fade-in-up    { animation: fadeInUp 0.4s ease-out both; }
    .row-enter     { animation: fadeInUp 0.3s ease-out both; }
    .filter-underline { transition: transform 0.25s cubic-bezier(0.65,0,0.35,1), width 0.25s ease-out; }
    .btn-tap       { transition: transform 0.12s ease-out; }
    .btn-tap:active { transform: scale(0.96); }
    .unread-dot    { animation: dotPulse 1.8s ease-in-out infinite; }
    .skeleton      { animation: shimmer 1.4s ease-in-out infinite; }
    .row-clear     { transition: opacity 0.25s ease-out, transform 0.25s ease-out, max-height 0.3s ease-out, margin 0.3s ease-out, padding 0.3s ease-out; }
  }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes dotPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.4); }
    50%      { box-shadow: 0 0 0 5px rgba(249, 115, 22, 0); }
  }
  @keyframes shimmer { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
</style>

<script>
(function () {

  const skeleton      = document.getElementById('skeleton');
  const notifGroups    = document.getElementById('notif-groups');
  const emptyState     = document.getElementById('empty-state');
  const filterButtons  = document.querySelectorAll('.filter-btn');
  const filterUnderline = document.getElementById('filter-underline');
  const markAllReadBtn = document.getElementById('mark-all-read-btn');

  const FILTER_ORDER = ['all', 'booking', 'message', 'system'];
  let activeFilter = 'all';
  let allNotifications = [];

  const TYPE_ICON = {
    booking: { icon: 'fa-calendar-check', bg: 'bg-brand-light', color: 'text-brand' },
    message: { icon: 'fa-comment', bg: 'bg-blue-50', color: 'text-blue-500' },
    system:  { icon: 'fa-shield-halved', bg: 'bg-amber-50', color: 'text-amber-500' },
    promo:   { icon: 'fa-tag', bg: 'bg-purple-50', color: 'text-purple-500' }
  };

  // ---- Filter tab switching ----
  function setActiveFilter(filter) {
    activeFilter = filter;
    const index = FILTER_ORDER.indexOf(filter);
    filterButtons.forEach(function (btn) {
      const isActive = btn.dataset.filter === filter;
      btn.classList.toggle('text-brand', isActive);
      btn.classList.toggle('font-semibold', isActive);
      btn.classList.toggle('text-slate-500', !isActive);
      btn.classList.toggle('font-medium', !isActive);
      btn.setAttribute('aria-selected', String(isActive));
    });
    filterUnderline.style.transform = 'translateX(' + (index * 100) + '%)';
    renderNotifications();
  }
  filterButtons.forEach(function (btn) {
    btn.addEventListener('click', function () { setActiveFilter(btn.dataset.filter); });
  });

  function timeGroupLabel(iso) {
    const date = new Date(iso);
    const now = new Date();
    const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const startOfYesterday = new Date(startOfToday);
    startOfYesterday.setDate(startOfYesterday.getDate() - 1);

    if (date >= startOfToday) return 'Today';
    if (date >= startOfYesterday) return 'Yesterday';
    return 'Earlier';
  }

  function relativeTime(iso) {
    const date = new Date(iso);
    const diffMs = Date.now() - date.getTime();
    const diffMin = Math.floor(diffMs / 60000);
    if (diffMin < 1) return 'Just now';
    if (diffMin < 60) return diffMin + 'm ago';
    const diffHr = Math.floor(diffMin / 60);
    if (diffHr < 24) return diffHr + 'h ago';
    const diffDay = Math.floor(diffHr / 24);
    if (diffDay < 7) return diffDay + 'd ago';
    return date.toLocaleDateString();
  }

  // ---- Render one notification row (untrusted content -> textContent) ----
  function renderNotifRow(notif, index) {
    const style = TYPE_ICON[notif.type] || TYPE_ICON.system;

    const row = document.createElement(notif.href ? 'a' : 'div');
    if (notif.href) row.href = notif.href;
    row.dataset.notifId = notif.id;
    row.className = 'row-enter row-clear flex items-start gap-3 rounded-2xl p-3.5 ' +
      (notif.isRead ? 'bg-white border border-slate-100' : 'bg-brand-light/40 border border-brand-light');
    row.style.animationDelay = (index * 40) + 'ms';

    const iconWrap = document.createElement('span');
    iconWrap.className = 'w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ' + style.bg;
    const icon = document.createElement('i');
    icon.className = 'fa-solid ' + style.icon + ' text-sm ' + style.color;
    icon.setAttribute('aria-hidden', 'true');
    iconWrap.appendChild(icon);
    row.appendChild(iconWrap);

    const info = document.createElement('div');
    info.className = 'min-w-0 flex-1';

    const titleRow = document.createElement('div');
    titleRow.className = 'flex items-center gap-1.5';
    const title = document.createElement('p');
    title.className = 'text-sm font-semibold text-slate-900 truncate';
    title.textContent = notif.title;   // untrusted — textContent only
    titleRow.appendChild(title);
    if (!notif.isRead) {
      const dot = document.createElement('span');
      dot.className = 'unread-dot w-1.5 h-1.5 rounded-full bg-accent shrink-0';
      titleRow.appendChild(dot);
    }
    info.appendChild(titleRow);

    const message = document.createElement('p');
    message.className = 'text-xs text-slate-500 mt-0.5 line-clamp-2';
    message.textContent = notif.message;   // untrusted — textContent only
    info.appendChild(message);

    if (notif.actionLabel) {
      const actionBtn = document.createElement('button');
      actionBtn.type = 'button';
      actionBtn.className = 'btn-tap mt-2 inline-flex items-center gap-1.5 rounded-lg bg-brand text-white text-xs font-semibold px-3 py-1.5';
      actionBtn.textContent = notif.actionLabel;   // untrusted — textContent only
      actionBtn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (notif.actionHref) window.location.href = notif.actionHref;
      });
      info.appendChild(actionBtn);
    }

    row.appendChild(info);

    const time = document.createElement('span');
    time.className = 'text-[11px] text-slate-400 shrink-0 whitespace-nowrap';
    time.textContent = relativeTime(notif.createdAt);
    row.appendChild(time);

    if (!notif.isRead) {
      row.addEventListener('click', function () { markAsRead(notif.id, row); }, { once: true });
    }

    return row;
  }

  function markAsRead(id, rowEl) {
    const notif = allNotifications.find(function (n) { return n.id === id; });
    if (notif) notif.isRead = true;
    if (rowEl) {
      rowEl.classList.remove('bg-brand-light/40', 'border-brand-light');
      rowEl.classList.add('bg-white', 'border-slate-100');
      const dot = rowEl.querySelector('.unread-dot');
      if (dot) dot.remove();
    }
    fetch('../api/mark-notification-read.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ notification_id: id })
    }).catch(function () { /* best-effort — UI already reflects read state */ });
  }

  function renderNotifications() {
    const filtered = activeFilter === 'all'
      ? allNotifications
      : allNotifications.filter(function (n) { return n.type === activeFilter; });

    notifGroups.innerHTML = '';

    if (!filtered.length) {
      notifGroups.classList.add('hidden');
      emptyState.classList.remove('hidden');
      return;
    }
    emptyState.classList.add('hidden');

    const groups = {};
    const groupOrder = [];
    filtered.forEach(function (notif) {
      const label = timeGroupLabel(notif.createdAt);
      if (!groups[label]) { groups[label] = []; groupOrder.push(label); }
      groups[label].push(notif);
    });

    let rowIndex = 0;
    groupOrder.forEach(function (label) {
      const section = document.createElement('section');
      const heading = document.createElement('h2');
      heading.className = 'text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2 px-1';
      heading.textContent = label;
      section.appendChild(heading);

      const rowsWrap = document.createElement('div');
      rowsWrap.className = 'space-y-2';
      groups[label].forEach(function (notif) {
        rowsWrap.appendChild(renderNotifRow(notif, rowIndex));
        rowIndex++;
      });
      section.appendChild(rowsWrap);
      notifGroups.appendChild(section);
    });

    notifGroups.classList.remove('hidden');
  }

  // ---- Mark all as read ----
  markAllReadBtn.addEventListener('click', function () {
    const unreadIds = allNotifications.filter(function (n) { return !n.isRead; }).map(function (n) { return n.id; });
    if (!unreadIds.length) return;
    allNotifications.forEach(function (n) { n.isRead = true; });
    renderNotifications();

    fetch('../api/mark-all-notifications-read.php', {
      method: 'POST',
      credentials: 'same-origin'
    }).catch(function () { /* best-effort */ });
  });

  // ---- Load notifications ----
  fetch('../api/get-notifications.php', { credentials: 'same-origin' })
    .then(function (res) { if (!res.ok) throw new Error('request_failed'); return res.json(); })
    .then(function (data) {
      allNotifications = Array.isArray(data.notifications) ? data.notifications : [];
      skeleton.classList.add('hidden');
      renderNotifications();
    })
    .catch(function () {
      // No backend running yet in this environment.
      allNotifications = [];
      skeleton.classList.add('hidden');
      renderNotifications();
    });

})();
</script>
