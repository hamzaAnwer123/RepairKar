<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings — RepairKar</title>
  <meta name="description" content="View all your RepairKar service bookings and their current status.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/x-icon" href="../assets/images/logo/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tailwind.min.css">
<link rel="stylesheet" href="../assets/css/loader.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    body { font-family: 'Inter', sans-serif; }
    @media (prefers-reduced-motion: no-preference) {
      .card-enter { animation: cardIn 0.35s ease-out both; }
      .skeleton   { animation: shimmer 1.4s ease-in-out infinite; }
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">

  <header class="sticky top-0 z-40 border-b border-slate-100 bg-white">
    <div class="mx-auto flex max-w-3xl items-center gap-3 px-4 py-4">
      <a href="profile.html" aria-label="Back to profile" class="flex h-9 w-9 items-center justify-center rounded-full hover:bg-slate-100">
        <i class="fa-solid fa-arrow-left text-slate-600" aria-hidden="true"></i>
      </a>
      <h1 class="text-lg font-bold text-slate-900">My Bookings</h1>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-4 py-6 pb-16">

    <!-- Loading skeleton -->
    <div id="bookings-skeleton" class="space-y-2" aria-hidden="true">
      <div class="skeleton h-[72px] rounded-2xl bg-slate-200"></div>
      <div class="skeleton h-[72px] rounded-2xl bg-slate-200"></div>
      <div class="skeleton h-[72px] rounded-2xl bg-slate-200"></div>
    </div>

    <!-- Bookings list -->
    <div id="bookings-list" class="hidden space-y-2"></div>

    <!-- Empty state -->
    <div id="bookings-empty" class="hidden rounded-2xl border border-slate-100 bg-white p-10 text-center">
      <i class="fa-regular fa-calendar text-3xl text-slate-300" aria-hidden="true"></i>
      <p class="mt-3 text-sm font-semibold text-slate-700">No bookings yet</p>
      <p class="mt-1 text-xs text-slate-500">When you book a mechanic, it will show up here.</p>
      <a href="home.html" class="mt-5 inline-block rounded-xl bg-brand px-4 py-2.5 text-xs font-semibold text-white shadow-sm hover:bg-brand-dark">Find a Mechanic</a>
    </div>

    <!-- Error state -->
    <div id="bookings-error" class="hidden rounded-2xl border border-slate-100 bg-white p-10 text-center">
      <i class="fa-solid fa-triangle-exclamation text-3xl text-slate-300" aria-hidden="true"></i>
      <p class="mt-3 text-sm text-slate-500">Could not load your bookings.</p>
      <button type="button" id="retry-btn" class="mt-5 rounded-xl border border-slate-200 px-4 py-2.5 text-xs font-semibold text-slate-700 hover:bg-slate-50">
        <i class="fa-solid fa-rotate-right mr-1 text-[10px]" aria-hidden="true"></i>Try Again
      </button>
    </div>

  </main>
  <script>
    (function () {
      'use strict';

      var listEl     = document.getElementById('bookings-list');
      var skeletonEl = document.getElementById('bookings-skeleton');
      var emptyEl    = document.getElementById('bookings-empty');
      var errorEl    = document.getElementById('bookings-error');
      var retryBtn   = document.getElementById('retry-btn');

      var STATUS_STYLES = {
        pending:   { label: 'Pending',   classes: 'bg-amber-50 text-amber-600' },
        accepted:  { label: 'Accepted',  classes: 'bg-blue-50 text-blue-600' },
        en_route:  { label: 'En Route',  classes: 'bg-blue-50 text-blue-600' },
        completed: { label: 'Completed', classes: 'bg-green-50 text-green-600' },
        cancelled: { label: 'Cancelled', classes: 'bg-slate-100 text-slate-500' }
      };

      function show(el) { if (el) el.classList.remove('hidden'); }
      function hide(el) { if (el) el.classList.add('hidden'); }

      function renderBookingRow(booking, index) {
        if (!booking) return null;
        var row = document.createElement('a');
        row.href = 'booking-status.html?booking_id=' + encodeURIComponent(booking.id || '');
        row.className = 'card-enter row-hover flex items-center gap-3 rounded-2xl border border-slate-100 bg-white p-3.5 hover:bg-slate-50';
        row.style.animationDelay = (index * 60) + 'ms';

        var img = document.createElement('img');
        img.src = booking.mechanicPhoto || '../assets/images/placeholders/default-mechnaic-profile.png';
        img.alt = '';
        img.width = 44;
        img.height = 44;
        img.className = 'h-11 w-11 shrink-0 rounded-xl bg-slate-100 object-cover';
        row.appendChild(img);

        var info = document.createElement('div');
        info.className = 'min-w-0 flex-1';
        var title = document.createElement('p');
        title.className = 'truncate text-sm font-semibold text-slate-900';
        title.textContent = booking.serviceTitle || 'Service';
        info.appendChild(title);
        var sub = document.createElement('p');
        sub.className = 'truncate text-xs text-slate-500';
        sub.textContent = booking.mechanicName || '';
        info.appendChild(sub);
        var meta = document.createElement('p');
        meta.className = 'mt-0.5 truncate text-[11px] text-slate-400';
        meta.textContent = booking.createdAt || '';
        info.appendChild(meta);
        row.appendChild(info);

        var statusInfo = STATUS_STYLES[booking.status] || STATUS_STYLES.pending;
        var badge = document.createElement('span');
        badge.className = 'shrink-0 rounded-full px-2.5 py-1 text-[11px] font-semibold ' + statusInfo.classes;
        badge.textContent = statusInfo.label;
        row.appendChild(badge);

        return row;
      }

      function renderBookings(bookings) {
        hide(skeletonEl);
        if (!Array.isArray(bookings) || !bookings.length) {
          show(emptyEl);
          return;
        }
        listEl.innerHTML = '';
        bookings.forEach(function (b, i) {
          var row = renderBookingRow(b, i);
          if (row) listEl.appendChild(row);
        });
        show(listEl);
      }

      function loadBookings() {
        hide(emptyEl);
        hide(errorEl);
        hide(listEl);
        show(skeletonEl);

        fetch('../api/get-user-bookings.php?limit=50', { credentials: 'same-origin' })
          .then(function (res) {
            if (res.status === 401 || res.status === 403) {
              window.location.replace('../login.html?redirect=' + encodeURIComponent('user/bookings.html'));
              return null;
            }
            if (!res.ok) throw new Error('request_failed');
            return res.json();
          })
          .then(function (data) {
            if (data === null) return; // redirecting to login
            renderBookings(Array.isArray(data.bookings) ? data.bookings : []);
          })
          .catch(function () {
            hide(skeletonEl);
            show(errorEl);
          });
      }

      if (retryBtn) retryBtn.addEventListener('click', loadBookings);

      loadBookings();
    }());
  </script>
<script src="../assets/js/loader.js"></script>
</body>
</html>
