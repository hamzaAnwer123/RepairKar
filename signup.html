<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up — RepairKar</title>
<meta name="description" content="Create your RepairKar account to find verified mechanics or start offering your services.">
<meta name="robots" content="noindex, follow">
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/images/logo/favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Tailwind CSS — compiled via Tailwind CLI (see tailwind.config.js + assets/css/input.css).
     Run `npm run build:css` after adding new classes here. -->
<link rel="stylesheet" href="assets/css/tailwind.min.css">
<link rel="stylesheet" href="assets/css/loader.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">

<style>
  body { font-family: 'Inter', sans-serif; }

  /* ===== Animations — all gated behind prefers-reduced-motion ===== */
  @media (prefers-reduced-motion: no-preference) {
    .fade-in-up {
      animation: fadeInUp 0.4s ease-out both;
    }
    .step-enter {
      animation: fadeInUp 0.3s ease-out both;
    }
    .shake {
      animation: shake 0.3s ease-in-out;
    }
    .role-card {
      transition: transform 0.15s ease-out, border-color 0.15s ease-out, background-color 0.15s ease-out;
    }
    .role-card:active {
      transform: scale(0.98);
    }
    .error-msg {
      animation: fadeInDown 0.25s ease-out both;
    }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-4px); }
    75%      { transform: translateX(4px); }
  }
</style>

<!--
  SECURITY NOTE: when served through PHP, any dynamic value echoed into
  this page must be escaped with htmlspecialchars(). Client-side
  validation below is UX only — api/register.php must independently
  re-validate and hash the password server-side regardless.
-->

</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center py-12 px-4">

<div class="w-full max-w-md fade-in-up">

  <!-- Logo -->
  <div class="text-center mb-8">
    <a href="index.html" class="inline-flex items-center" aria-label="RepairKar home">
      <img src="assets/images/logo/logo.png" alt="RepairKar" class="h-9 w-auto mx-auto" width="160" height="36">
    </a>
    <p class="mt-1 text-sm text-slate-500">Create your account to get started.</p>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 sm:p-8">

    <!-- ============ STEP 1: ROLE SELECTION ============ -->
    <div id="step-1">
      <h1 class="text-lg font-bold text-slate-900 mb-1">How would you like to use RepairKar?</h1>
      <p class="text-sm text-slate-500 mb-6">Choose one to continue.</p>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" role="radiogroup" aria-label="Account type">

        <button type="button" data-role="user"
                class="role-card group text-left rounded-2xl border-2 border-slate-200 p-5 hover:border-brand focus:outline-none focus:ring-2 focus:ring-brand"
                role="radio" aria-checked="false">
          <span class="w-12 h-12 rounded-xl bg-brand-light flex items-center justify-center">
            <i class="fa-solid fa-user text-brand text-lg" aria-hidden="true"></i>
          </span>
          <span class="block mt-3 font-semibold text-slate-900">I need a mechanic</span>
          <span class="block mt-1 text-xs text-slate-500">Find verified professionals and book services.</span>
        </button>

        <button type="button" data-role="mechanic"
                class="role-card group text-left rounded-2xl border-2 border-slate-200 p-5 hover:border-brand focus:outline-none focus:ring-2 focus:ring-brand"
                role="radio" aria-checked="false">
          <span class="w-12 h-12 rounded-xl bg-brand-light flex items-center justify-center">
            <i class="fa-solid fa-wrench text-brand text-lg" aria-hidden="true"></i>
          </span>
          <span class="block mt-3 font-semibold text-slate-900">I am a mechanic</span>
          <span class="block mt-1 text-xs text-slate-500">Offer your skills and manage bookings.</span>
        </button>

      </div>
    </div>

    <!-- ============ STEP 2: FORM (hidden until a role is picked) ============ -->
    <form id="step-2" class="hidden mt-2" novalidate>

      <button type="button" id="back-btn"
              class="inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-brand mb-4">
        <i class="fa-solid fa-arrow-left text-xs" aria-hidden="true"></i> Back
      </button>

      <div id="selected-role-banner" class="hidden items-center gap-2 rounded-xl bg-brand-light text-brand text-sm font-medium px-4 py-2.5 mb-5">
        <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
        <span id="selected-role-text"></span>
      </div>

      <div class="space-y-4">

        <div>
          <label for="full-name" class="block text-sm font-medium text-slate-700 mb-1.5">Full Name</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm" aria-hidden="true"></i>
            <input type="text" id="full-name" name="name" required autocomplete="name" placeholder="John Doe"
                   class="w-full rounded-xl border border-slate-200 pl-10 pr-4 py-2.5 text-sm focus:ring-2 focus:ring-brand focus:border-brand focus:outline-none">
          </div>
          <p class="error-msg hidden text-xs text-red-600 mt-1.5" data-error-for="full-name"></p>
        </div>

        <div id="email-field">
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">Email Address</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm" aria-hidden="true"></i>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com"
                   class="w-full rounded-xl border border-slate-200 pl-10 pr-4 py-2.5 text-sm focus:ring-2 focus:ring-brand focus:border-brand focus:outline-none">
          </div>
          <p class="error-msg hidden text-xs text-red-600 mt-1.5" data-error-for="email"></p>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm" aria-hidden="true"></i>
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"
                   class="w-full rounded-xl border border-slate-200 pl-10 pr-11 py-2.5 text-sm focus:ring-2 focus:ring-brand focus:border-brand focus:outline-none">
            <button type="button" data-toggle-for="password" aria-label="Show password"
                    class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
              <i class="fa-solid fa-eye text-sm" aria-hidden="true"></i>
            </button>
          </div>
          <p class="error-msg hidden text-xs text-red-600 mt-1.5" data-error-for="password"></p>
        </div>

        <div>
          <label for="confirm-password" class="block text-sm font-medium text-slate-700 mb-1.5">Confirm Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm" aria-hidden="true"></i>
            <input type="password" id="confirm-password" name="confirm_password" required autocomplete="new-password" placeholder="Re-enter your password"
                   class="w-full rounded-xl border border-slate-200 pl-10 pr-11 py-2.5 text-sm focus:ring-2 focus:ring-brand focus:border-brand focus:outline-none">
            <button type="button" data-toggle-for="confirm-password" aria-label="Show password"
                    class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
              <i class="fa-solid fa-eye text-sm" aria-hidden="true"></i>
            </button>
          </div>
          <p class="error-msg hidden text-xs text-red-600 mt-1.5" data-error-for="confirm-password"></p>
        </div>

        <p id="form-error" class="error-msg hidden text-sm text-red-600 bg-red-50 rounded-xl px-4 py-2.5"></p>

        <button type="submit" id="submit-btn"
                class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-accent hover:bg-accent-dark text-white text-sm font-semibold px-5 py-3 transition-colors disabled:opacity-60 disabled:cursor-not-allowed">
          <i id="submit-spinner" class="fa-solid fa-spinner animate-spin hidden" aria-hidden="true"></i>
          <span id="submit-text">Create Account</span>
        </button>

      </div>
    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
      Already have an account?
      <a href="login.html" class="text-brand font-medium hover:underline">Log in</a>
    </p>

  </div>
</div>

<script>
(function () {
  const step1 = document.getElementById('step-1');
  const step2 = document.getElementById('step-2');
  const roleCards = document.querySelectorAll('[data-role]');
  const backBtn = document.getElementById('back-btn');
  const roleBanner = document.getElementById('selected-role-banner');
  const roleBannerText = document.getElementById('selected-role-text');
  const form = document.getElementById('step-2');
  const submitBtn = document.getElementById('submit-btn');
  const submitSpinner = document.getElementById('submit-spinner');
  const submitText = document.getElementById('submit-text');
  const formError = document.getElementById('form-error');

  let selectedRole = null;

  // ---- Role selection (Step 1 -> Step 2) ----
  roleCards.forEach(function (card) {
    card.addEventListener('click', function () {
      selectedRole = card.getAttribute('data-role');

      roleCards.forEach(function (c) {
        c.classList.remove('border-brand', 'bg-brand-light/40');
        c.classList.add('border-slate-200');
        c.setAttribute('aria-checked', 'false');
      });
      card.classList.remove('border-slate-200');
      card.classList.add('border-brand', 'bg-brand-light/40');
      card.setAttribute('aria-checked', 'true');

      roleBannerText.textContent = selectedRole === 'mechanic'
        ? "Signing up as a mechanic"
        : "Signing up as a user";
      roleBanner.classList.remove('hidden');
      roleBanner.classList.add('flex');

      step1.classList.add('hidden');
      step2.classList.remove('hidden');
      step2.classList.add('step-enter');
      document.getElementById('full-name').focus();
    });
  });

  // ---- Back button (Step 2 -> Step 1) ----
  backBtn.addEventListener('click', function () {
    step2.classList.add('hidden');
    step1.classList.remove('hidden');
    step1.classList.add('step-enter');
  });

  // ---- Password show/hide toggles ----
  document.querySelectorAll('[data-toggle-for]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const targetId = btn.getAttribute('data-toggle-for');
      const input = document.getElementById(targetId);
      const icon = btn.querySelector('i');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      icon.classList.toggle('fa-eye', !isHidden);
      icon.classList.toggle('fa-eye-slash', isHidden);
      btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });
  });

  // ---- Helpers ----
  function showFieldError(fieldId, message) {
    const el = document.querySelector('[data-error-for="' + fieldId + '"]');
    if (!el) return;
    el.textContent = message;
    el.classList.remove('hidden');
  }
  function clearFieldErrors() {
    document.querySelectorAll('.error-msg').forEach(function (el) {
      el.classList.add('hidden');
      el.textContent = '';
    });
  }
  function isValidEmail(value) {
    // Standard-enough client-side check — api/register.php must still
    // validate this properly server-side (e.g. with PHP's
    // filter_var($email, FILTER_VALIDATE_EMAIL)), never trust this alone.
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value.trim());
  }

  // ---- Submit ----
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearFieldErrors();

    const name = document.getElementById('full-name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm-password').value;

    let hasError = false;

    if (name.length < 2) {
      showFieldError('full-name', 'Please enter your full name.');
      hasError = true;
    }
    if (!isValidEmail(email)) {
      showFieldError('email', 'Enter a valid email address.');
      hasError = true;
    }
    if (password.length < 8) {
      showFieldError('password', 'Password must be at least 8 characters.');
      hasError = true;
    }
    if (confirmPassword !== password) {
      showFieldError('confirm-password', 'Passwords do not match.');
      hasError = true;
    }
    if (!selectedRole) {
      hasError = true;
    }

    if (hasError) {
      form.classList.add('shake');
      setTimeout(function () { form.classList.remove('shake'); }, 300);
      return;
    }

    // ---- Loading state ----
    submitBtn.disabled = true;
    submitSpinner.classList.remove('hidden');
    submitText.textContent = 'Creating account...';
    formError.classList.add('hidden');

    const payload = {
      name: name,
      password: password,
      role: selectedRole,
      signup_method: 'email',
      email: email
    };

    fetch('api/register.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify(payload)
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok) {
          throw new Error(result.data && result.data.message ? result.data.message : 'Something went wrong. Please try again.');
        }
        window.location.href = selectedRole === 'mechanic'
          ? 'mechanic/dashboard.html'
          : 'user/home.html';
      })
      .catch(function (err) {
        formError.textContent = err.message;
        formError.classList.remove('hidden');
        submitBtn.disabled = false;
        submitSpinner.classList.add('hidden');
        submitText.textContent = 'Create Account';
      });
  });
})();
</script>

<script src="assets/js/loader.js"></script>
</body>
</html>
