<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password — RepairKar</title>
<meta name="description" content="Reset your RepairKar account password using your phone number or email.">
<meta name="robots" content="noindex, follow">
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/images/logo/favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Tailwind CSS — compiled via Tailwind CLI. Run `npm run build:css` after adding new classes. -->
<link rel="stylesheet" href="assets/css/tailwind.min.css">
<link rel="stylesheet" href="assets/css/loader.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">

<style>
  body { font-family: 'Inter', sans-serif; }

  @media (prefers-reduced-motion: no-preference) {
    .fade-in-up { animation: fadeInUp 0.4s ease-out both; }
    .step-enter { animation: fadeInUp 0.3s ease-out both; }
    .shake { animation: shake 0.3s ease-in-out; }
    .error-msg { animation: fadeInDown 0.25s ease-out both; }
    .success-pop { animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-4px); }
    75%      { transform: translateX(4px); }
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.9); }
    to   { opacity: 1; transform: scale(1); }
  }
</style>

<!--
  SECURITY NOTE: api/forgot-password.php must return the SAME success
  message regardless of whether the phone/email exists in the database
  — never reveal "no account found" here, as that lets an attacker
  enumerate valid accounts. Always respond as if a reset link/code was
  sent, and only actually send one if the account exists.
-->

</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center py-12 px-4">

<div class="w-full max-w-md fade-in-up">

  <div class="text-center mb-8">
    <a href="index.html" class="inline-flex items-center" aria-label="RepairKar home">
      <img src="assets/images/logo/logo.png" alt="RepairKar" class="h-9 w-auto mx-auto" width="160" height="36">
    </a>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 sm:p-8">

    <!-- ============ STATE 1: REQUEST FORM ============ -->
    <div id="request-state">
      <a href="login.html" class="inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-brand mb-5">
        <i class="fa-solid fa-arrow-left text-xs" aria-hidden="true"></i> Back to Login
      </a>

      <h1 class="text-lg font-bold text-slate-900 mb-1">Forgot your password?</h1>
      <p class="text-sm text-slate-500 mb-6">Enter the phone number or email linked to your account and we'll send you reset instructions.</p>

      <form id="reset-form" novalidate>
        <label for="identifier" class="block text-sm font-medium text-slate-700 mb-1.5">Phone Number or Email</label>
        <div class="relative">
          <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm" aria-hidden="true"></i>
          <input type="text" id="identifier" name="identifier" required autocomplete="username" placeholder="300 1234567 or you@example.com"
                 class="w-full rounded-xl border border-slate-200 pl-10 pr-4 py-2.5 text-sm focus:ring-2 focus:ring-brand focus:border-brand focus:outline-none">
        </div>
        <p class="error-msg hidden text-xs text-red-600 mt-1.5" data-error-for="identifier"></p>

        <p id="form-error" class="error-msg hidden text-sm text-red-600 bg-red-50 rounded-xl px-4 py-2.5 mt-4"></p>

        <button type="submit" id="submit-btn"
                class="w-full mt-5 inline-flex items-center justify-center gap-2 rounded-xl bg-accent hover:bg-accent-dark text-white text-sm font-semibold px-5 py-3 transition-colors disabled:opacity-60 disabled:cursor-not-allowed">
          <i id="submit-spinner" class="fa-solid fa-spinner animate-spin hidden" aria-hidden="true"></i>
          <span id="submit-text">Send Reset Instructions</span>
        </button>
      </form>
    </div>

    <!-- ============ STATE 2: SUCCESS CONFIRMATION ============ -->
    <div id="success-state" class="hidden text-center">
      <div class="success-pop mx-auto w-14 h-14 rounded-full bg-brand-light flex items-center justify-center">
        <i class="fa-solid fa-check text-brand text-xl" aria-hidden="true"></i>
      </div>
      <h1 class="text-lg font-bold text-slate-900 mt-4">Check your inbox</h1>
      <p class="text-sm text-slate-500 mt-2">
        If an account exists for <span id="sent-to" class="font-medium text-slate-700"></span>,
        we've sent reset instructions there. It may take a few minutes to arrive.
      </p>
      <a href="login.html"
         class="w-full mt-6 inline-flex items-center justify-center rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-semibold px-5 py-3 transition-colors">
        Back to Login
      </a>
      <button type="button" id="resend-btn"
              class="block w-full mt-3 text-sm text-brand font-medium hover:underline">
        Didn't get it? Try a different number or email
      </button>
    </div>

  </div>
</div>

<script>
(function () {
  const requestState = document.getElementById('request-state');
  const successState = document.getElementById('success-state');
  const form = document.getElementById('reset-form');
  const identifierInput = document.getElementById('identifier');
  const submitBtn = document.getElementById('submit-btn');
  const submitSpinner = document.getElementById('submit-spinner');
  const submitText = document.getElementById('submit-text');
  const formError = document.getElementById('form-error');
  const sentTo = document.getElementById('sent-to');
  const resendBtn = document.getElementById('resend-btn');

  function isValidPakPhone(value) {
    return /^(\+92|0)?3\d{2}\s?\d{7}$/.test(value.trim());
  }
  function isValidEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value.trim());
  }
  function showFieldError(fieldId, message) {
    const el = document.querySelector('[data-error-for="' + fieldId + '"]');
    if (!el) return;
    el.textContent = message;
    el.classList.remove('hidden');
  }
  function clearFieldErrors() {
    document.querySelectorAll('.error-msg').forEach(function (el) {
      el.classList.add('hidden');
      el.textContent = '';
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearFieldErrors();

    const value = identifierInput.value.trim();

    if (!isValidPakPhone(value) && !isValidEmail(value)) {
      showFieldError('identifier', 'Enter a valid phone number or email address.');
      form.classList.add('shake');
      setTimeout(function () { form.classList.remove('shake'); }, 300);
      return;
    }

    submitBtn.disabled = true;
    submitSpinner.classList.remove('hidden');
    submitText.textContent = 'Sending...';
    formError.classList.add('hidden');

    fetch('api/forgot-password.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ identifier: value })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok) {
          throw new Error(result.data && result.data.message ? result.data.message : 'Something went wrong. Please try again.');
        }
        // Always show the same success state regardless of whether the
        // account actually existed — see the SECURITY NOTE in <head>.
        sentTo.textContent = value;
        requestState.classList.add('hidden');
        successState.classList.remove('hidden');
        successState.classList.add('step-enter');
      })
      .catch(function (err) {
        formError.textContent = err.message;
        formError.classList.remove('hidden');
      })
      .finally(function () {
        submitBtn.disabled = false;
        submitSpinner.classList.add('hidden');
        submitText.textContent = 'Send Reset Instructions';
      });
  });

  resendBtn.addEventListener('click', function () {
    successState.classList.add('hidden');
    requestState.classList.remove('hidden');
    requestState.classList.add('step-enter');
    identifierInput.value = '';
    identifierInput.focus();
  });
})();
</script>

<script src="assets/js/loader.js"></script>
</body>
</html>
